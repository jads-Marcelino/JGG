<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridiano Studio · prototype</title>
<style>
/*FONTS*/
:root{--g:#0F2420;--g2:#1F5A4C;--teal:#2E8070;--brass:#C9A94E;--brass2:#A8832C;--ink:#14211D;--mut:#5E716A;--sub:#8FA79F;--line:#E2E6E1;--paper:#F8F6F1;--card:#FFFFFF;--tint:#E2EEE8;--red:#B4532F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Karla,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:14px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--g2)}
.serif{font-family:Newsreader,Georgia,serif}
/* top bar */
#nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;height:58px;padding:0 22px;background:rgba(248,246,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#nav .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--g)}
#nav .logo b{font:400 20px Newsreader;letter-spacing:-.3px}#nav .logo i{font:700 9px Karla;letter-spacing:2.5px;color:var(--brass2);font-style:normal;text-transform:uppercase;border:1px solid var(--brass);border-radius:100px;padding:2px 7px}
#nav .links{display:flex;gap:4px;margin-left:10px}
#nav .links a{text-decoration:none;color:var(--mut);font-weight:600;padding:8px 12px;border-radius:8px}
#nav .links a.on{color:var(--g);background:var(--tint)}
#nav .sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 12px 4px 4px;font-weight:600}
.persona select{border:0;background:transparent;font-weight:600;outline:none}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 11px Karla;flex:none;position:relative}
.av.sm{width:22px;height:22px;font-size:9px}
.av.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:#3BB273;border:2px solid #fff}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:9px 15px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--g);white-space:nowrap}
.btn:hover{border-color:#C9D3CE}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.br{background:var(--brass);border-color:var(--brass);color:var(--g)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--g2);font:700 10px Karla;letter-spacing:2px;text-transform:uppercase;padding:5px 11px 4px;border-radius:100px}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--brass)}
.pill{display:inline-block;font:700 11px Karla;padding:3px 9px;border-radius:100px;background:#F1F3EF;color:var(--mut)}
.pill.ok{background:#E2F3E9;color:#22784A}.pill.warn{background:#F7EDD5;color:#8A6A1F}.pill.blue{background:#DEECF1;color:#2F6F86}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px -24px rgba(15,36,32,.45)}
.wrap{max-width:1180px;margin:0 auto;padding:40px 28px 80px}
h1.big{font:400 52px/1.05 Newsreader;letter-spacing:-1.2px;color:var(--g)}
h2.t{font:400 30px/1.15 Newsreader;color:var(--g)}
h3.t{font:400 21px/1.2 Newsreader;color:var(--g)}
.lead{font-size:17px;line-height:1.55;color:var(--mut);max-width:720px}
.muted{color:var(--mut)}.small{font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid3,.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:700 11px Karla;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.field input,.field select,.field textarea{border:1px solid #D6DCD7;background:#fff;border-radius:9px;padding:10px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--g2);box-shadow:0 0 0 3px var(--tint)}
.field input[readonly]{background:#F4F5F2;color:var(--mut)}
.step{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.step .dot{width:24px;height:24px;border-radius:50%;border:2px solid #CCD4CF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.step.done .dot{background:var(--g2);border-color:var(--g2)}.step.run .dot{border-color:var(--brass);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--g);color:#EDEDE7;border-radius:11px;padding:11px 15px;max-width:360px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,36,32,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:520px;max-width:100%;background:#fff;border-radius:16px;padding:26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
/* tour */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.stepcard{padding:24px;display:flex;flex-direction:column;gap:10px}
.stepcard .n{font:400 44px/1 Newsreader;color:var(--brass2)}
.stepcard .btns{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
/* dashboard */
.proj{display:flex;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.thumbS{width:132px;height:74px;border-radius:7px;overflow:hidden;flex:none;position:relative;background:var(--g)}
/* studio */
#studio{display:flex;gap:10px;padding:10px;height:calc(100vh - 58px)}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ptop{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:#FCFBF8}
.ptop .ttl{font:400 17px Newsreader;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .brn{white-space:nowrap;font:600 12px ui-monospace,Menlo,monospace;color:var(--mut);background:#F1F3EF;border-radius:6px;padding:3px 7px}
.ptop .faces{display:flex;margin-left:6px}.ptop .faces .av{margin-left:-6px;border:2px solid #fff}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:150px 1fr 320px}
.pleft{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;background:#FCFBF8}
.th{position:relative;border-radius:7px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--g);aspect-ratio:16/9}
.th.sel{border-color:var(--brass)}
.th .num{position:absolute;left:4px;top:3px;font:700 9px Karla;color:#fff;background:rgba(15,36,32,.6);border-radius:4px;padding:1px 4px;z-index:2}
.th .cm{position:absolute;right:4px;top:3px;font:700 9px Karla;color:var(--g);background:var(--brass);border-radius:8px;padding:1px 5px;z-index:2}
.th .who{position:absolute;right:3px;bottom:3px;z-index:2;display:flex}
.th .dirty{position:absolute;left:4px;bottom:4px;width:7px;height:7px;border-radius:50%;background:var(--brass);z-index:2}
.mini{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
.pcenter{display:flex;flex-direction:column;min-width:0;background:#EEF0EB}
.ctool{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#F7F7F3}
.seg{display:inline-flex;background:#E6E9E4;border-radius:8px;padding:2px}
.seg button{padding:5px 11px;border-radius:6px;font-weight:700;font-size:12.5px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwrap{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}
.stage{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(15,36,32,.6);background:var(--g)}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide [data-edit]{outline:none;border-radius:6px;transition:box-shadow .15s}
.editing .slide [data-edit]:hover{box-shadow:0 0 0 4px rgba(201,169,78,.55)}
.editing .slide [data-edit]:focus{box-shadow:0 0 0 5px #C9A94E}
.pres{position:absolute;pointer-events:none;border:3px solid;border-radius:6px;z-index:5;transition:all .2s}
.pres span{position:absolute;left:-3px;top:-24px;font:700 11px Karla;color:#fff;padding:3px 8px;border-radius:6px 6px 6px 0;white-space:nowrap}
.code{flex:1;min-height:0;width:100%;border:0;outline:none;resize:none;padding:16px;font:12.5px/1.55 ui-monospace,Menlo,monospace;background:#0F2420;color:#D8E3DE}
.pright{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;background:#FCFBF8}
.tabs button{padding:11px 9px;font-weight:700;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--g);border-bottom-color:var(--brass)}
.tabs .bd{display:inline-block;min-width:17px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--brass);color:var(--g);font-size:10.5px}
.rbody{flex:1;min-height:0;overflow:auto;padding:14px}
.cmt{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;background:#fff}
.cmt.res{opacity:.55}
.cmt .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}.cmt .h b{font-size:13px}.cmt .h .small{margin-left:auto}
.cmt p{line-height:1.45}
.cmt .anc{font:600 11px Karla;color:var(--brass2);margin-bottom:5px}
.cmt .rep{border-left:2px solid var(--tint);margin:8px 0 0 6px;padding-left:9px}
.ment{color:var(--g2);font-weight:700;background:var(--tint);border-radius:4px;padding:0 3px}
textarea.in,input.in{width:100%;border:1px solid #D6DCD7;border-radius:9px;padding:9px 11px;outline:none;background:#fff;resize:vertical}
textarea.in:focus,input.in:focus{border-color:var(--g2)}
.diff{font:11.5px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.diff div{padding:1px 8px;white-space:pre-wrap;word-break:break-all}
.diff .a{background:#E6F4EA;color:#1E6B3A}.diff .d{background:#FBE9E4;color:#9A3B1B;text-decoration:line-through;text-decoration-color:rgba(154,59,27,.4)}
.diff .fh{background:#F4F5F2;color:var(--mut);font-weight:700}
.commit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sha{font:600 11.5px ui-monospace,Menlo,monospace;color:var(--g2);background:var(--tint);border-radius:5px;padding:1px 6px}
.log div{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13px}
.compact .pbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) 230px}
.compact .pleft{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
.compact .pleft .th{width:96px;flex:none}
.compact .pright{border-left:0;border-top:1px solid var(--line)}
.compact .cwrap{padding:10px}
/* site */
.browser{max-width:1180px;margin:22px auto;border-radius:14px;overflow:hidden;border:1px solid #CFD6D1;background:#fff;box-shadow:0 30px 60px -40px rgba(0,0,0,.6)}
.bbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#ECEEEA;border-bottom:1px solid #D9DED9}
.bbar .dots i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;background:#D3D8D4}
.url{flex:1;background:#fff;border-radius:8px;padding:7px 12px;font:13px ui-monospace,Menlo,monospace;color:var(--mut);display:flex;gap:6px;align-items:center}
.url b{color:var(--ink);font-weight:500}
.sitebody{background:#0B1C19;position:relative}
.sitebody .stage{max-width:none;border-radius:0;box-shadow:none}
.newver{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;background:var(--brass);color:var(--g);font-weight:700;padding:8px 14px;border-radius:100px;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);cursor:pointer}
/* mail + github mock */
.mailbox{display:grid;grid-template-columns:300px 1fr;min-height:520px}
.mailbox .list{border-right:1px solid var(--line)}
.mail{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mail.sel{background:var(--tint)}
.gh{max-width:460px;margin:30px auto;background:#fff;border:1px solid #D0D7DE;border-radius:12px;padding:28px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1F2328}
.gh .btngh{width:100%;background:#1F883D;color:#fff;border-radius:7px;padding:10px;font-weight:600}
.gh li{list-style:none;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EAEEF2;font-size:14px}
/* how */
.arch{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
@media(max-width:900px){.arch{grid-template-columns:1fr 1fr}}
.node{padding:16px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--g2)}
.node h4{font:400 18px Newsreader;color:var(--g);margin-bottom:6px}
.node ul{padding-left:16px;color:var(--mut);line-height:1.5;font-size:13px}
.flowrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.flowrow .f{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;color:var(--g)}
.flowrow .ar{color:var(--brass2);font-weight:700}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.t th{background:var(--tint);color:var(--g2);font:700 11px Karla;letter-spacing:1.5px;text-transform:uppercase;text-align:left;padding:10px 12px}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.hidden{display:none!important}
@media(max-width:1100px){.pbody{grid-template-columns:120px 1fr 280px}}
</style></head><body>

'slides/04-decision-chain.html': [

/* ---------- state ---------- */
function clone(o){return JSON.parse(JSON.stringify(o));}
function sha(){var c='0123456789abcdef',s='';for(var i=0;i<7;i++)s+=c[Math.floor(Math.random()*16)];return s;}
function now(){return Date.now();}
function seed(){
  var files=clone(SLIDES), t=now()-1000*60*60*26;
  return {
    v:1, signedIn:false,
    project:null,
    files:files, base:clone(files), live:clone(files),
    commits:[], comments:[], invites:[], members:[], presence:{}, activity:[],
    deploy:{state:'idle', sha:null, at:null, steps:[]}, liveSha:null
  };
}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||S.v!==1)S=seed();
var bc=null; try{bc=new BroadcastChannel('meridiano-studio')}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(bc){try{bc.postMessage({t:'state',from:TAB,s:S})}catch(e){}}}
if(bc)bc.onmessage=function(e){if(!e.data||e.data.from===TAB)return; if(e.data.t==='state'){var prev=S;S=e.data.s;onShared(null,{remote:true,prev:prev});} if(e.data.t==='toast')toast(e.data.msg,e.data.who);};

var SES={user:'jadson'}; // per-tab session
try{var u=sessionStorage.getItem('ms-user'); if(u&&USERS[u])SES.user=u;}catch(e){}
function setUser(u){SES.user=u; try{sessionStorage.setItem('ms-user',u)}catch(e){} }

function ago(t){if(!t)return'';var s=Math.round((now()-t)/1000);if(s<10)return'just now';if(s<60)return s+'s ago';var m=Math.round(s/60);if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function av(id,cls){var u=USERS[id];return '<span class="av '+(cls||'')+'" style="background:'+u.color+'" title="'+esc(u.name)+'">'+u.ini+'</span>';}
function log(who,txt){S.activity.unshift({who:who,txt:txt,t:now()}); S.activity=S.activity.slice(0,40);}
function toast(msg,who,local){var w=document.getElementById('toasts');var d=document.createElement('div');d.className='toast';d.innerHTML=(who?av(who,'sm'):'')+'<span>'+msg+'</span>';w.appendChild(d);setTimeout(function(){d.style.opacity='0';d.style.transition='opacity .4s'},3800);setTimeout(function(){d.remove()},4300);
  if(!local&&bc){try{bc.postMessage({t:'toast',from:TAB,msg:msg,who:who})}catch(e){}}}

/* ---------- project creation (shared helpers) ---------- */
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function createProject(o){
  S.project={name:o.name, repo:o.repo, owner:'jads-Marcelino', visibility:o.visibility, template:o.template, created:now()};
  S.files=clone(SLIDES); S.base=clone(SLIDES); S.live=clone(SLIDES);
  var c={sha:sha(), msg:'Create project from template “'+o.templateName+'”', author:'jadson', t:now(), files:Object.keys(SLIDES).length, snap:clone(SLIDES), changed:Object.keys(SLIDES)};
  S.commits=[c]; S.liveSha=c.sha; S.deploy={state:'live',sha:c.sha,at:now(),steps:[]};
  S.members=[{id:'jadson',role:'Owner',joined:now()}];
  S.comments=[]; S.invites=[];
  log('jadson','created '+o.name+' and published '+siteUrl());
}
function siteUrl(){return S.project?('https://jads-marcelino.github.io/'+S.project.repo+'/'):'';}
function ensureProject(){ if(!S.project){createProject({name:'Data Strategy for Leaders',repo:'data-strategy-for-leaders',visibility:'Public',template:'course',templateName:'Executive course deck'}); S.signedIn=true;} }
function isMember(id){return S.members.some(function(m){return m.id===id});}
function ensureGuest(){ ensureProject(); if(!S.invites.length){S.invites.push({email:USERS.gustavo.email,role:'Editor',status:'pending',t:now(),by:'jadson'});}
  if(!isMember('gustavo')){S.invites.forEach(function(i){if(i.email===USERS.gustavo.email)i.status='accepted'}); S.members.push({id:'gustavo',role:'Editor',joined:now()}); log('gustavo','joined and connected GitHub @'+USERS.gustavo.gh);} }

function paths(){return Object.keys(S.files);}
function dirtyPaths(){return paths().filter(function(k){return S.files[k]!==S.base[k]});}
function slideTitle(src){var m=/data-edit="title"[^>]*>([\s\S]*?)<\/h[12]>/.exec(src);var d=document.createElement('div');d.innerHTML=m?m[1]:'';return d.textContent;}

function onlineUsers(){var o=[SES.user];panes.forEach(function(p){if(o.indexOf(p.user)<0)o.push(p.user)});Object.keys(S.presence).forEach(function(k){if(now()-S.presence[k].t<60000&&o.indexOf(k)<0)o.push(k)});return o;}
function renderLeft(p){
  var L=q(p,'.pleft');
  L.innerHTML=paths().map(function(k,i){var cm=S.comments.filter(function(c){return c.path===k&&!c.resolved}).length;
    var who=Object.keys(S.presence).filter(function(u){return u!==p.user&&S.presence[u].path===k&&now()-S.presence[u].t<60000});

  L.querySelectorAll('.th').forEach(function(t){var w=t.clientWidth||130;t.querySelector('.mini').style.transform='scale('+(w/1920)+')';});
}
function renderCenter(p){
  var C=q(p,'.pcenter');
  C.innerHTML='<div class="ctool"><div class="seg"><button data-p="'+p.id+'" data-act="mode" data-v="visual" class="'+(p.mode==='visual'?'on':'')+'">Visual</button><button data-p="'+p.id+'" data-act="mode" data-v="code" class="'+(p.mode==='code'?'on':'')+'">Code</button></div><span class="path">'+p.path+'</span><div style="flex:1"></div><button class="btn sm" data-p="'+p.id+'" data-act="addCommentHere" title="Comment on this slide">💬 Comment</button></div>'+
   (p.mode==='visual'?'<div class="cwrap"><div class="stage editing"><div class="slide"></div></div></div>':'<textarea class="code" spellcheck="false"></textarea>');
  if(p.mode==='visual'){fillCanvas(p);}
  else{var ta=C.querySelector('textarea');ta.value=S.files[p.path];ta.oninput=function(){applyEdit(p,p.path,ta.value,'code');};ta.onfocus=function(){setPresence(p,p.path,'code');};}
}
function fitStage(stage){var sl=stage.querySelector('.slide');function f(){var w=stage.clientWidth;if(w)sl.style.transform='scale('+(w/1920)+')';}f();if(window.ResizeObserver){new ResizeObserver(f).observe(stage);}else window.addEventListener('resize',f);}
function mountStage(stage,html){stage.innerHTML='<div class="slide">'+html+'</div>';fitStage(stage);}
function fillCanvas(p){
  var stage=q(p,'.stage'), sl=stage.querySelector('.slide');
  sl.innerHTML=S.files[p.path]; fitStage(stage);
  sl.querySelectorAll('[data-edit]').forEach(function(el){
    el.setAttribute('contenteditable','true'); el.setAttribute('spellcheck','false');
    el.addEventListener('focus',function(){p.editing=el.getAttribute('data-edit');setPresence(p,p.path,p.editing);});
    el.addEventListener('blur',function(){p.editing=null;});
    el.addEventListener('input',function(){applyEdit(p,p.path,serialize(sl),'visual');});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur();}});
  });
  drawPresence(p);
}
function serialize(sl){var c=sl.cloneNode(true);c.querySelectorAll('[contenteditable]').forEach(function(e){e.removeAttribute('contenteditable');e.removeAttribute('spellcheck');});return c.innerHTML;}
function drawPresence(p){
  if(p.mode!=='visual')return; var stage=q(p,'.stage'); if(!stage)return;
  stage.querySelectorAll('.pres').forEach(function(e){e.remove()});
  Object.keys(S.presence).forEach(function(u){
    var pr=S.presence[u]; if(u===p.user||pr.path!==p.path||!pr.key||now()-pr.t>60000)return;
    var el=stage.querySelector('[data-edit="'+pr.key+'"]'); if(!el)return;
    var a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();
    var box=document.createElement('div');box.className='pres';box.style.borderColor=USERS[u].color;
    box.style.left=(b.left-a.left-5)+'px';box.style.top=(b.top-a.top-5)+'px';box.style.width=(b.width+10)+'px';box.style.height=(b.height+10)+'px';
    box.innerHTML='<span style="background:'+USERS[u].color+'">'+USERS[u].short+(pr.typing&&now()-pr.typing<1500?' is typing…':'')+'</span>';stage.appendChild(box);
  });
}
function setPresence(p,path,key,typing){S.presence[p.user]={path:path,key:key,t:now(),typing:typing?now():(S.presence[p.user]&&S.presence[p.user].typing)};share(p,{presence:true});}

/* shared-state change propagation */
var thumbTimer=null;
function applyEdit(src,path,html,how){
  S.files[path]=html; S.presence[src?src.user:'gustavo']={path:path,key:src?src.editing||how:'title',t:now(),typing:now()};
  share(src,{edit:path});
}
function share(src,what){persist();onShared(src,what);}
function onShared(src,what){
  var r=route();
  if(r==='#/studio'||r==='#/together'){
    panes.forEach(function(p){
      var isSrc=(p===src);
      renderTop(p);
      if(!isSrc&&(!what||what.edit===p.path||what.remote||what.all)){
        if(p.mode==='visual'){ var stage=q(p,'.stage'); var active=stage&&stage.contains(document.activeElement); if(!active)fillCanvas(p); else drawPresence(p);}
        else { var ta=q(p,'textarea.code'); if(ta&&document.activeElement!==ta)ta.value=S.files[p.path]; }
      } else drawPresence(p);
      if(!(p.el.querySelector('.pright').contains(document.activeElement))) renderRight(p); else p.pendingRight=true;
    });
    clearTimeout(thumbTimer);thumbTimer=setTimeout(function(){panes.forEach(renderLeft)},250);
  } else if(r==='#/site'){ siteCheck(); }
  else if(what&&what.remote&&(r==='#/project'||r==='#/dashboard')) render();
}
document.addEventListener('focusout',function(){setTimeout(function(){panes.forEach(function(p){if(p.pendingRight&&!p.el.querySelector('.pright').contains(document.activeElement)){p.pendingRight=false;renderRight(p);}})},0);});

/* right panel */
function renderRight(p){
  var R=q(p,'.pright'); if(!R)return;
  var open=S.comments.filter(function(c){return !c.resolved}).length, d=dirtyPaths().length;
  var tabs=[['comments','Comments',open],['changes','Changes',d],['history','History',0],['deploy','Deploy',0]];
  R.innerHTML='<div class="tabs">'+tabs.map(function(t){return '<button data-p="'+p.id+'" data-act="tab" data-v="'+t[0]+'" class="'+(p.tab===t[0]?'on':'')+'">'+t[1]+(t[2]?'<span class="bd">'+t[2]+'</span>':'')+'</button>'}).join('')+'</div><div class="rbody"></div>';
  var B=R.querySelector('.rbody');
  if(p.tab==='comments')B.innerHTML=commentsHTML(p);
  if(p.tab==='changes')B.innerHTML=changesHTML(p);
  if(p.tab==='history')B.innerHTML=historyHTML(p);
  if(p.tab==='deploy')B.innerHTML=deployHTML(p);
  var ta=B.querySelector('[data-draft]'); if(ta){ta.value=p[ta.getAttribute('data-draft')]||'';ta.oninput=function(){p[ta.getAttribute('data-draft')]=ta.value;};}
  B.querySelectorAll('[data-reply]').forEach(function(i){i.value=(p.replies||{})[i.getAttribute('data-reply')]||'';i.oninput=function(){p.replies=p.replies||{};p.replies[i.getAttribute('data-reply')]=i.value;};});
}
function mention(t){return esc(t).replace(/@(Jadson|Gustavo)/g,'<span class="ment">@$1</span>');}
function commentsHTML(p){
  var here=S.comments.filter(function(c){return c.path===p.path}), others=S.comments.filter(function(c){return c.path!==p.path&&!c.resolved});
  var form='<div style="margin-bottom:14px"><textarea class="in" rows="2" data-draft="draft" placeholder="Comment on slide '+(paths().indexOf(p.path)+1)+'… use @'+(p.user==='jadson'?'Gustavo':'Jadson')+' to notify"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="small">'+(p.editing?'On “'+p.editing+'”':'On this slide')+'</span><button class="btn sm pri" data-p="'+p.id+'" data-act="comment">Comment</button></div></div>';
  function one(c){return '<div class="cmt '+(c.resolved?'res':'')+'"><div class="h">'+av(c.author,'sm')+'<b>'+USERS[c.author].short+'</b><span class="small">'+ago(c.t)+'</span></div>'+(c.key?'<p class="anc">on “'+c.key+'” · slide '+(paths().indexOf(c.path)+1)+'</p>':'<p class="anc">slide '+(paths().indexOf(c.path)+1)+'</p>')+'<p>'+mention(c.text)+'</p>'+
    c.replies.map(function(r){return '<div class="rep"><div class="h">'+av(r.author,'sm')+'<b>'+USERS[r.author].short+'</b><span class="small">'+ago(r.t)+'</span></div><p>'+mention(r.text)+'</p></div>'}).join('')+
    (c.resolved?'<p class="small" style="margin-top:6px">Resolved by '+USERS[c.resolvedBy].short+'</p>':'<div style="display:flex;gap:6px;margin-top:8px"><input class="in" style="padding:6px 9px" data-reply="'+c.id+'" placeholder="Reply…"><button class="btn sm" data-p="'+p.id+'" data-act="reply" data-v="'+c.id+'">↵</button><button class="btn sm" data-p="'+p.id+'" data-act="resolve" data-v="'+c.id+'" title="Resolve">✓</button></div>')+'</div>';}
  return form+(here.length?here.slice().reverse().map(one).join(''):'<p class="small" style="margin-bottom:12px">No comments on this slide yet.</p>')+
    (others.length?'<p class="small" style="margin:14px 0 8px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Other slides</p>'+others.slice().reverse().map(one).join(''):'')+
    '<p class="small" style="margin-top:12px;line-height:1.45">Comments are stored with the project and mirrored to the commit on GitHub, so they survive outside the studio.</p>';
}
function diffLines(a,b){var A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length,dp=[],i,j;for(i=0;i<=n;i++){dp[i]=new Array(m+1).fill(0);}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var out=[];i=0;j=0;while(i<n&&j<m){if(A[i]===B[j]){i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['d',A[i++]]);}else out.push(['a',B[j++]]);}
  while(i<n)out.push(['d',A[i++]]);while(j<m)out.push(['a',B[j++]]);return out;}
function textOf(line){var d=document.createElement('div');d.innerHTML=line;var t=d.textContent.trim();return t||line.replace(/\s+/g,' ').slice(0,90);}
function diffHTML(path,a,b){var ops=diffLines(a||'',b||'');if(!ops.length)return '';return '<div class="diff"><div class="fh">'+path+'</div>'+ops.map(function(o){return '<div class="'+o[0]+'">'+(o[0]==='a'?'+ ':'− ')+esc(textOf(o[1]))+'</div>'}).join('')+'</div>';}
function changesHTML(p){
  var d=dirtyPaths(); var lastBy={};Object.keys(S.presence).forEach(function(u){lastBy[S.presence[u].path]=u;});
  if(!d.length)return '<div style="text-align:center;padding:30px 10px"><p class="serif" style="font-size:22px;color:var(--g)">Everything is committed</p><p class="small" style="margin-top:6px;line-height:1.5">Edit any text on a slide. Changes are shared live with everyone in the studio, and become a version when someone commits.</p></div>';
  var users=[];d.forEach(function(k){var u=lastBy[k];if(u&&users.indexOf(u)<0)users.push(u)});
  return '<p class="small" style="margin-bottom:8px">'+d.length+' file'+(d.length>1?'s':'')+' changed since '+(S.commits[0]?'<span class="sha">'+S.commits[0].sha+'</span>':'')+' · shared draft'+(users.length?' · edited by '+users.map(function(u){return USERS[u].short}).join(' & '):'')+'</p>'+
    d.map(function(k){return diffHTML(k,S.base[k],S.files[k])}).join('')+
    '<div style="position:sticky;bottom:-14px;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line)"><textarea class="in" rows="2" data-draft="msg" placeholder="Describe the change (commit message)"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-p="'+p.id+'" data-act="discard">Discard</button><button class="btn sm pri" style="flex:1;justify-content:center" data-p="'+p.id+'" data-act="commit">Commit &amp; publish as '+USERS[p.user].short+'</button></div><p class="small" style="margin-top:6px">Creates a commit on <b>main</b> signed by @'+USERS[p.user].gh+' and redeploys '+esc(siteUrl())+'</p></div>';
}
function historyHTML(p){
  return S.commits.map(function(c,i){return '<div class="commit">'+av(c.author,'sm')+'<div style="flex:1;min-width:0"><b>'+esc(c.msg)+'</b><p class="small">'+USERS[c.author].short+' · '+ago(c.t)+' · '+c.changed.length+' file'+(c.changed.length>1?'s':'')+(S.liveSha===c.sha?' · <span class="pill ok">live</span>':'')+'</p>'+
   '<div style="display:flex;gap:6px;margin-top:6px"><span class="sha">'+c.sha+'</span><button class="btn sm" style="padding:2px 8px" data-p="'+p.id+'" data-act="showCommit" data-v="'+c.sha+'">'+(p.openSha===c.sha?'Hide':'View')+' changes</button>'+(i>0?'<button class="btn sm" style="padding:2px 8px" data-p="'+p.id+'" data-act="restore" data-v="'+c.sha+'">Restore</button>':'')+'</div>'+
   (p.openSha===c.sha?c.changed.map(function(k){var prev=S.commits[i+1];return diffHTML(k,prev?prev.snap[k]:'',c.snap[k])}).join('')||'<p class="small">Initial version</p>':'')+'</div></div>'}).join('');
}
function deployHTML(p){
  var dp=S.deploy, st=dp.state;
  var steps=dp.steps&&dp.steps.length?dp.steps:['Checkout '+(dp.sha||''),'Build: python build.py','Upload Pages artifact','Deploy to GitHub Pages'];
  var k=st==='live'?steps.length:(dp.k||0);
  return '<div class="card" style="padding:14px;box-shadow:none"><p class="small">Site</p><p style="font:13px ui-monospace,Menlo,monospace;margin:4px 0 10px;word-break:break-all"><a href="#/site">'+esc(siteUrl())+'</a></p>'+
   '<p>'+(st==='live'?'<span class="pill ok">Live</span>':'<span class="pill warn">Deploying</span>')+' <span class="sha" style="margin-left:6px">'+(st==='live'?S.liveSha:dp.sha)+'</span> <span class="small">'+ago(dp.at)+'</span></p></div>'+
   '<p class="small" style="margin:14px 0 6px;font-weight:700;letter-spacing:1px;text-transform:uppercase">GitHub Actions · pages-build</p><div class="log">'+steps.map(function(s,i){return '<div><span class="dot" style="width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:'+(i<k?'var(--g2)':'#D3D9D5')+'">'+(i<k?'✓':'')+'</span>'+esc(s)+'</div>'}).join('')+'</div>'+
   '<p class="small" style="margin-top:12px;line-height:1.5">The studio is live; the site is versioned. Visitors see a new version of the .io when they refresh after a commit.</p>';
}

/* actions */
function paneById(id){return panes[+id];}
function doCommit(p){
  var d=dirtyPaths(); if(!d.length)return;
  var msg=(p.msg||'').trim()||('Update '+d.map(function(k){return k.replace('slides/','').replace('.html','')}).join(', '));
  var c={sha:sha(),msg:msg,author:p.user,t:now(),changed:d,snap:clone(S.files)};
  S.commits.unshift(c); S.base=clone(S.files); p.msg='';
  log(p.user,'committed “'+msg+'” ('+c.sha+')');
  startDeploy(c); share(p,{all:true});
  toast(USERS[p.user].short+' committed “'+esc(msg)+'” · deploying',p.user);
}
var deployTimer=null;
function startDeploy(c){
  S.deploy={state:'building',sha:c.sha,at:now(),k:0,steps:['Checkout '+c.sha,'Build: python build.py','Upload Pages artifact','Deploy to GitHub Pages']};
  clearInterval(deployTimer);
  deployTimer=setInterval(function(){S.deploy.k++; if(S.deploy.k>=4){clearInterval(deployTimer);S.deploy.state='live';S.deploy.at=now();S.live=clone(c.snap);S.liveSha=c.sha;log(c.author,'published '+c.sha+' to '+siteUrl());toast('Live: '+c.sha+' is on the .io',c.author,true);} share(null,{all:true});},900);
}
function addComment(p){
  var t=(p.draft||'').trim(); if(!t)return;
  S.comments.push({id:sha(),path:p.path,key:p.editing,author:p.user,text:t,t:now(),replies:[],resolved:false}); p.draft='';
  log(p.user,'commented on slide '+(paths().indexOf(p.path)+1));
  share(p,{all:true});
  var other=p.user==='jadson'?'Gustavo':'Jadson'; if(t.indexOf('@'+other)>=0)toast(USERS[p.user].short+' mentioned '+other+': “'+esc(t.slice(0,60))+'”',p.user);
  renderRight(p);
}

/* ---------- LIVE SITE (.io) ---------- */
var SITE={i:0,shown:null,watch:null};
routes['#/site']=function(v){
  ensureProject(); SITE.shown=S.liveSha; SITE.snap=clone(S.live);
  v.innerHTML='<div style="padding:0 16px"><div class="browser"><div class="bbar"><span class="dots"><i></i><i></i><i></i></span><button class="btn sm ghost" data-act="siteReload" title="Refresh">⟳</button><div class="url">🔒 <b>'+esc(siteUrl().replace('https://',''))+'</b></div><span class="small" id="siteVer"></span></div><div class="sitebody" id="siteBody"><div class="stage" id="siteStage"></div></div>'+
  '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)"><button class="btn sm" data-act="sitePrev">‹</button><span id="siteN" class="small"></span><button class="btn sm" data-act="siteNext">›</button><div style="flex:1"></div><span class="small">Public page on GitHub Pages · anyone with the link</span></div></div>'+
  '<p class="small" style="text-align:center;margin-bottom:30px">This is what a client sees. It changes only after a commit is deployed: keep this open, commit in the studio, then refresh.</p></div>';
  drawSite(); SITE.watch=setInterval(siteCheck,1000);
};
function drawSite(){var ks=Object.keys(SITE.snap);SITE.i=Math.max(0,Math.min(SITE.i,ks.length-1));mountStage(document.getElementById('siteStage'),SITE.snap[ks[SITE.i]]);
  document.getElementById('siteN').textContent=(SITE.i+1)+' / '+ks.length;var c=S.commits.filter(function(x){return x.sha===SITE.shown})[0];
  document.getElementById('siteVer').innerHTML='version <span class="sha">'+SITE.shown+'</span>'+(c?' · '+USERS[c.author].short:'');}
function siteCheck(){var b=document.getElementById('siteBody');if(!b)return;var n=b.querySelector('.newver');
  if(S.liveSha!==SITE.shown){if(!n){n=document.createElement('div');n.className='newver';n.setAttribute('data-act','siteReload');b.appendChild(n);}n.textContent='New version '+S.liveSha+' published · refresh';}
  else if(n)n.remove();}
function stopSiteWatch(){if(SITE.watch){clearInterval(SITE.watch);SITE.watch=null;}}

/* ---------- HOW IT WORKS ---------- */

  v.innerHTML='<div class="wrap"><span class="chip">Architecture</span><h1 class="big" style="margin-top:12px">How it would work for real</h1><p class="lead" style="margin-top:12px">The same process we followed by hand in these sessions, automated: a Meridiano template in a GitHub repository, a build script, GitHub Pages for the .io and people working on the files. The studio adds live editing, comments and a safe way for non-developers to commit.</p>'+
  '<div class="flowrow"><span class="f">Owner signs in with GitHub</span><span class="ar">→</span><span class="f">Repo + Pages created from template</span><span class="ar">→</span><span class="f">Invite by e-mail</span><span class="ar">→</span><span class="f">Guest signs up + connects GitHub</span><span class="ar">→</span><span class="f">Live co-editing</span><span class="ar">→</span><span class="f">Commit</span><span class="ar">→</span><span class="f">Actions build → .io updated</span></div>'+
  '<div class="arch" style="margin-top:10px">'+
  node('Studio (web app)',['Next.js or SvelteKit, runs in any browser, iPad included','Visual and code editing of slides','Comments, mentions, history, restore','Deployed on Vercel or Cloudflare'])+
  node('Real-time layer',['Yjs (CRDT) over WebSocket, or Liveblocks','Merges simultaneous typing without conflicts','Presence: who is where, who is typing','Draft state persisted every few seconds'])+
  node('Backend',['Auth: GitHub OAuth through a GitHub App','Invites: signed links, e-mail via Resend or SES','Postgres: users, projects, roles, comments','Commits through the GitHub API, as the user'])+
  node('GitHub',['One repository per project, from a Meridiano template','Collaborators added on invite acceptance','Actions: python build.py on every push','Pages publishes the .io; history lives in Git'])+
  '</div>'+
  '<h2 class="t" style="margin:34px 0 12px">The three steps, mapped</h2><table class="t"><tr><th>Step</th><th>What the person does</th><th>What happens behind</th></tr>'+
  '<tr><td><b>1 · Owner creates and shares</b></td><td>Signs in with GitHub, picks a template, names the project, types an e-mail and a role</td><td>GitHub App creates the repo from the template, enables Pages, runs the first build. The invite is a signed token stored in Postgres and sent by e-mail</td></tr>'+
  '<tr><td><b>2 · Guest joins</b></td><td>Opens the e-mail, creates an account, clicks Connect GitHub</td><td>OAuth links the GitHub user; the App adds them as collaborator with the right permission (write for Editors)</td></tr>'+
  '<tr><td><b>3 · Both work</b></td><td>Edit text visually or in code, comment, commit</td><td>Edits sync live through Yjs. A commit writes the files with the GitHub API under the author’s name; Actions rebuilds; the .io serves the new version on refresh</td></tr></table>'+
  '<h2 class="t" style="margin:34px 0 12px">What is simulated in this prototype</h2><table class="t"><tr><th>Real here</th><th>Simulated here</th></tr><tr><td>Live editing between the two panes and between browser tabs on the same device · comments, replies and resolve · diffs, commits, history and restore · the published site changing only after a commit</td><td>GitHub sign-in, repositories, collaborators, Actions and Pages · e-mail delivery · accounts and passwords · sync between different devices (needs the real-time server)</td></tr></table>'+
  '<h2 class="t" style="margin:34px 0 12px">Rough cost to run</h2><table class="t"><tr><th>Item</th><th>Starting cost</th></tr><tr><td>GitHub (Pages, Actions, repos)</td><td>Free for public repos; Team plan for private repos with Pages</td></tr><tr><td>Hosting the studio</td><td>Free tier to ~US$20/month</td></tr><tr><td>Real-time (Liveblocks or self-hosted Yjs)</td><td>Free tier for a small team; self-hosted on a small server</td></tr><tr><td>Postgres + e-mail</td><td>Free tiers cover the first projects</td></tr></table>'+
  '<p class="small" style="margin-top:12px">Indicative; vendor prices change and should be checked before building.</p></div>';
};
function node(t,items){return '<div class="node"><h4>'+t+'</h4><ul>'+items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul></div>';}

/* ---------- simulated collaborator ---------- */
var botOn=false;
function runBot(){
  if(botOn)return; ensureGuest(); persist(); botOn=true;
  var path='slides/06-next-step.html', p=null;
  var target='Pick one decision. Measure it before and after. Then scale.';
  var cur=S.files[path], m=/(data-edit="title"[^>]*>)([\s\S]*?)(<\/h2>)/.exec(cur), start=m[2];
  toast('Gustavo opened the studio','gustavo',true);
  panes.forEach(function(pp){if(!pp.compact&&pp.user!=='gustavo'){pp.path=path;pp.tab='comments';renderLeft(pp);renderCenter(pp);renderRight(pp);}});
  S.presence.gustavo={path:path,key:'title',t:now()}; share(null,{all:true});
  var base=start.indexOf('Then scale')>=0?start.replace(/ Then scale\.?/,''):start; var add=target.slice(base.length); if(target.indexOf(base)!==0){add=' Then scale.';}
  var i=0;
  setTimeout(function step(){
    if(i<=add.length){var t=base+add.slice(0,i);S.files[path]=S.files[path].replace(/(data-edit="title"[^>]*>)([\s\S]*?)(<\/h2>)/,'$1'+t+'$3');S.presence.gustavo={path:path,key:'title',t:now(),typing:now()};share(null,{edit:path});i++;setTimeout(step,110);}
    else setTimeout(function(){
      S.comments.push({id:sha(),path:path,key:'title',author:'gustavo',text:'@Jadson I added “Then scale.” to the closing line. OK to use this version in the health-plan meeting?',t:now(),replies:[],resolved:false});
      log('gustavo','commented on slide 6'); share(null,{all:true}); toast('Gustavo mentioned you: “I added Then scale. to the closing line…”','gustavo',true);
      setTimeout(function(){var gp={user:'gustavo',msg:'Tighten closing line'};doCommit(gp);botOn=false;},2600);
    },700);
  },1200);
}

/* ---------- global click delegation ---------- */
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){e.preventDefault();var m=document.querySelector('.modal-bg');if(m)m.remove();go(g.getAttribute('data-go'));return;}
  var a=e.target.closest('[data-act]'); if(!a)return;
  var act=a.getAttribute('data-act'), v=a.getAttribute('data-v'), p=a.hasAttribute('data-p')?paneById(a.getAttribute('data-p')):null;
  switch(act){
    case 'reset': if(confirm('Reset the demo to the beginning?')){S=seed();persist();setUser('jadson');NP.step=1;JN.step=1;go('#/');}break;
    case 'demoTogether': go('#/together'); break;
    case 'ghOwner': go('#/gh-owner'); break;
    case 'ghOwnerOk': S.signedIn=true; persist(); go(S.project?'#/dashboard':'#/new'); break;
    case 'tpl': NP.template=v; var t=TEMPLATES.filter(function(x){return x[0]===v})[0]; if(v==='course'){NP.name='Data Strategy for Leaders';} else NP.name=t[1].replace(' deck','').replace('Blank Meridiano','New Meridiano deck'); NP.repo=slug(NP.name); render(); break;
    case 'npNext': NP.step=2; render(); break;
    case 'npBack': NP.step=1; render(); break;
    case 'npCreate': if(!NP.repo){alert('Choose a repository name');break;} NP.step=3; render(); break;
    case 'openShare': if(!S.signedIn){S.signedIn=true;} openShare(); break;
    case 'closeModal': var mb=document.querySelector('.modal-bg'); if(mb)mb.remove(); break;
    case 'sendInvite': sendInvite(); break;
    case 'toInbox': document.querySelector('.modal-bg').remove(); go('#/inbox'); break;
    case 'jnNext': JN.step=2; render(); break;
    case 'jnGh': JN.step=3; render(); break;
    case 'jnAuth': JN.step=4; render(); break;
    case 'jnStudio': setUser('gustavo'); JN.step=1; go('#/studio'); break;
    case 'pick': p.path=v; p.editing=null; S.presence[p.user]={path:v,key:null,t:now()}; renderLeft(p); renderCenter(p); renderRight(p); share(p,{presence:true}); break;
    case 'mode': p.mode=v; renderCenter(p); break;
    case 'tab': p.tab=v; renderRight(p); break;
    case 'toChanges': p.tab='changes'; renderRight(p); break;
    case 'addCommentHere': p.tab='comments'; renderRight(p); var ta=q(p,'.pright textarea'); if(ta)ta.focus(); break;
    case 'comment': addComment(p); break;
    case 'reply': var c=S.comments.filter(function(x){return x.id===v})[0]; var txt=((p.replies||{})[v]||'').trim(); if(c&&txt){c.replies.push({author:p.user,text:txt,t:now()});p.replies[v]='';log(p.user,'replied to a comment');share(p,{all:true});renderRight(p);} break;
    case 'resolve': var c2=S.comments.filter(function(x){return x.id===v})[0]; if(c2){c2.resolved=true;c2.resolvedBy=p.user;share(p,{all:true});renderRight(p);} break;
    case 'commit': doCommit(p); break;
    case 'discard': if(confirm('Discard all uncommitted changes for everyone?')){S.files=clone(S.base);log(p.user,'discarded uncommitted changes');share(p,{all:true});panes.forEach(function(x){renderCenter(x);renderLeft(x);});} break;
    case 'showCommit': p.openSha=p.openSha===v?null:v; renderRight(p); break;
    case 'restore': var cc=S.commits.filter(function(x){return x.sha===v})[0]; if(cc&&confirm('Bring back version '+v+' as uncommitted changes?')){S.files=clone(cc.snap);log(p.user,'restored version '+v);share(p,{all:true});panes.forEach(function(x){renderCenter(x);renderLeft(x);});p.tab='changes';renderRight(p);} break;
    case 'siteReload': SITE.shown=S.liveSha; SITE.snap=clone(S.live); drawSite(); siteCheck(); break;
    case 'sitePrev': SITE.i--; drawSite(); break;
    case 'siteNext': SITE.i++; drawSite(); break;
    case 'bot': runBot(); break;
  }
});
document.addEventListener('keydown',function(e){if(route()==='#/site'){if(e.key==='ArrowRight'){SITE.i++;drawSite();}if(e.key==='ArrowLeft'){SITE.i--;drawSite();}}});
setInterval(function(){ if(route()==='#/studio'||route()==='#/together'){panes.forEach(function(p){drawPresence(p);});} },1500);
render();
</script>
