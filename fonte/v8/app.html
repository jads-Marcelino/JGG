<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2420">
<title>Meridiano Studio</title>
<style>
/*FONTS*/
:root{--g:#0F2420;--g2:#1F5A4C;--teal:#2E8070;--brass:#C9A94E;--brass2:#A8832C;--ink:#14211D;--mut:#5E716A;--sub:#8FA79F;--line:#E2E6E1;--paper:#F8F6F1;--tint:#E2EEE8;--sand:#F5ECD3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Karla,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:14px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--g2)}
#nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:60px;padding:0 22px;background:rgba(248,246,241,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#nav .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--g)}
#nav .logo b{font:400 21px Newsreader;letter-spacing:-.3px}
#nav .links{display:flex;gap:2px;margin-left:8px}
#nav .links a{text-decoration:none;color:var(--mut);font-weight:700;padding:8px 12px;border-radius:9px}
#nav .links a.on{color:var(--g);background:var(--tint)}
#nav .sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 10px 4px 4px;font-weight:700}
.persona select{border:0;background:transparent;font-weight:700;outline:none;max-width:170px}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font:700 11px Karla;flex:none;position:relative;border:2px solid #fff}
.av.sm{width:24px;height:24px;font-size:9px}.av.lg{width:44px;height:44px;font-size:14px}
.av.on::after{content:'';position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#3BB273;border:2px solid #fff}
.av.ai{background:linear-gradient(135deg,#1F5A4C,#C9A94E)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--g);white-space:nowrap}
.btn:hover{border-color:#C9D3CE}.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.br{background:var(--brass);border-color:var(--brass);color:var(--g)}
.btn.ok{background:#1F7A4A;border-color:#1F7A4A;color:#fff}.btn.no{color:#9A3B1B}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}.btn.xl{padding:18px 28px;font-size:18px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--tint);color:var(--g2);font:700 10.5px Karla;letter-spacing:2px;text-transform:uppercase;padding:6px 12px 5px;border-radius:100px}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--brass)}
.live{display:inline-flex;align-items:center;gap:6px;font:700 11px Karla;letter-spacing:1px;text-transform:uppercase;color:#C0392B}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#E0533D;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,83,61,.5)}70%{box-shadow:0 0 0 8px rgba(224,83,61,0)}100%{box-shadow:0 0 0 0 rgba(224,83,61,0)}}
.pill{display:inline-block;font:700 11px Karla;padding:3px 9px;border-radius:100px;background:#F1F3EF;color:var(--mut)}
.pill.ok{background:#E2F3E9;color:#1F7A4A}.pill.warn{background:var(--sand);color:#8A6A1F}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 34px -26px rgba(15,36,32,.5)}
.wrap{max-width:1200px;margin:0 auto;padding:40px 28px 80px}
h1.big{font:400 58px/1.03 Newsreader;letter-spacing:-1.6px;color:var(--g)}
h2.t{font:400 32px/1.1 Newsreader;color:var(--g)}h3.t{font:400 21px/1.2 Newsreader;color:var(--g)}
.lead{font-size:18px;line-height:1.55;color:var(--mut);max-width:620px}
.muted{color:var(--mut)}.small{font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:980px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
.toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--g);color:#EDEDE7;border-radius:12px;padding:11px 15px;max-width:380px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,36,32,.38);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:540px;max-width:100%;background:#fff;border-radius:18px;padding:26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font:700 11px Karla;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.in{width:100%;border:1px solid #D6DCD7;border-radius:10px;padding:10px 12px;outline:none;background:#fff;resize:vertical}
.in:focus{border-color:var(--g2);box-shadow:0 0 0 3px var(--tint)}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--g);border-radius:10px}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* HOME */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding-top:10px}
@media(max-width:980px){.hero{grid-template-columns:1fr}}
.hero h1 i{color:var(--brass2)}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:28px;align-items:flex-start}
.cta .btn.xl{box-shadow:0 18px 30px -16px rgba(168,131,44,.8)}
.cta .btn.xl .live{color:var(--g)}.cta .btn.xl .live::before{background:#C0392B}
.demo{position:relative;padding:18px;border-radius:22px;background:linear-gradient(160deg,#fff,#F1EFE7);border:1px solid var(--line);box-shadow:0 30px 60px -40px rgba(15,36,32,.7)}
.demo .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.demo .bar .faces{display:flex}.demo .bar .faces .av{margin-left:-7px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.demo .bar .faces .av.in{transform:scale(1)}
.demo .cap{display:flex;gap:10px;align-items:center;margin-top:14px;min-height:48px}
.demo .cap .n{font:400 30px/1 Newsreader;color:var(--brass2);width:26px}
.demo .cap p{font-size:15px;line-height:1.4;color:var(--ink)}
.demo .dots{display:flex;gap:6px;margin-top:8px}.demo .dots i{width:22px;height:4px;border-radius:2px;background:#DCE1DC;transition:background .3s}.demo .dots i.on{background:var(--brass)}
.ov{position:absolute;pointer-events:none;border-radius:6px;transition:all .3s;z-index:5}
.ov span{position:absolute;left:-2px;top:-22px;font:700 10px Karla;color:#fff;padding:3px 7px;border-radius:5px 5px 5px 0;white-space:nowrap}
.stamp{position:absolute;right:16px;top:16px;z-index:6;background:#1F7A4A;color:#fff;font:700 13px Karla;padding:7px 12px;border-radius:9px;transform:scale(0) rotate(-8deg);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.stamp.in{transform:scale(1) rotate(-4deg)}
.aibox{position:absolute;left:14px;bottom:14px;z-index:6;background:#fff;border-radius:11px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:all .3s}
.aibox.in{opacity:1;transform:none}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
@media(max-width:980px){.steps4{grid-template-columns:1fr 1fr}}
.s4{padding:20px}.s4 .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.sec-h{display:flex;align-items:flex-end;gap:14px;margin:56px 0 18px}.sec-h div{flex:1}
.deckcard{overflow:hidden;cursor:pointer;transition:transform .2s}
.deckcard:hover{transform:translateY(-3px)}
.deckcard .th{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--g)}
.deckcard .th .live{position:absolute;left:10px;top:10px;background:#fff;border-radius:100px;padding:4px 9px;z-index:2}
.deckcard .bd{padding:14px 16px}
.faces{display:flex}.faces .av{margin-left:-7px}.faces .av:first-child{margin-left:0}
.mini{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
.tpl .th{border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{padding:7px 13px;border-radius:100px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--mut)}.filters button.on{background:var(--g);color:#fff;border-color:var(--g)}
/* ROOM */
#room{display:grid;grid-template-columns:168px 1fr 360px;height:calc(100vh - 60px)}
@media(max-width:1100px){#room{grid-template-columns:120px 1fr 320px}}
.rtop{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
#room{grid-template-rows:auto minmax(0,1fr)}
.rtop .ttl{font:400 19px Newsreader;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.rtop .faces .av{cursor:pointer}
.rleft{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#FCFBF8}
.th2{position:relative;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--g);aspect-ratio:16/9;flex:none}
.th2.sel{border-color:var(--brass)}
.th2 .num{position:absolute;left:4px;top:3px;font:700 9px Karla;color:#fff;background:rgba(15,36,32,.6);border-radius:4px;padding:1px 5px;z-index:2}
.th2 .pr{position:absolute;right:4px;top:3px;font:700 9px Karla;color:var(--g);background:var(--brass);border-radius:8px;padding:1px 6px;z-index:2}
.th2 .who{position:absolute;right:3px;bottom:3px;z-index:2;display:flex}.th2 .who .av{width:18px;height:18px;font-size:7px;border-width:1px;margin-left:-4px}
.rcenter{display:flex;flex-direction:column;min-width:0;background:#ECEEE9}
.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;font-weight:700}
.banner.follow{background:var(--g);color:#EDEDE7}.banner.prop{background:var(--sand);color:#6E5418}
.ctool{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:#F7F7F3}
.seg{display:inline-flex;background:#E4E8E3;border-radius:9px;padding:2px}.seg button{padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--mut)}.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cwrap{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:center}
.cwrap .stage{max-width:1120px;box-shadow:0 20px 44px -24px rgba(15,36,32,.7)}
.editing .slide [data-edit]{outline:none;border-radius:6px}
.editing .slide [data-edit]:hover{box-shadow:0 0 0 4px rgba(201,169,78,.5)}
.editing .slide [data-edit]:focus{box-shadow:0 0 0 5px #C9A94E}
.rright{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;background:#FCFBF8}
.tabs button{flex:1;padding:12px 4px;font-weight:700;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--g);border-bottom-color:var(--brass)}
.bd2{display:inline-block;min-width:17px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--brass);color:var(--g);font-size:10.5px}
.rbody{flex:1;min-height:0;overflow:auto;padding:14px}
.msg{display:flex;gap:9px;margin-bottom:12px}.msg .bub{flex:1;background:#F4F5F1;border-radius:4px 12px 12px 12px;padding:10px 12px;line-height:1.45}
.msg.me .bub{background:var(--tint)}.msg.ai .bub{background:#FBF6E8;border:1px solid #EFE2BC}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.prompts button{border:1px solid #E7DAB2;background:#FFFCF3;border-radius:100px;padding:6px 11px;font-size:12.5px;font-weight:700;color:#7A5C17}
.prop{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.prop.open{box-shadow:inset 3px 0 0 var(--brass)}
.prop .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.diff{font:12px/1.5 Karla;border-radius:9px;overflow:hidden;margin:6px 0;border:1px solid var(--line)}
.diff div{padding:4px 9px}.diff .d{background:#FBE9E4;color:#9A3B1B;text-decoration:line-through;text-decoration-color:rgba(154,59,27,.45)}.diff .a{background:#E6F4EA;color:#1E6B3A}.diff .k{background:#F4F5F2;color:var(--mut);font:700 10px Karla;letter-spacing:1px;text-transform:uppercase}
.cmt{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px}
.cmt .h{display:flex;gap:8px;align-items:center;margin-bottom:5px}.cmt .h .small{margin-left:auto}
.cmt .anc{font:700 11px Karla;color:var(--brass2);margin-bottom:4px}
.ment{color:var(--g2);font-weight:700;background:var(--tint);border-radius:4px;padding:0 3px}
.ver{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.vn{font:400 20px/1 Newsreader;color:var(--brass2);width:38px}
.waiting{display:flex;gap:8px;align-items:center;background:#FFFCF3;border:1px dashed #E1CF9B;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#7A5C17;margin-top:8px}
.how-node{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--g2)}
.how-node h4{font:400 19px Newsreader;color:var(--g);margin-bottom:6px}.how-node ul{padding-left:16px;color:var(--mut);line-height:1.5;font-size:13.5px}
.viewer{background:#0B1C19;min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;padding:20px}
.viewer .stage{max-width:1240px;border-radius:12px}
.hidden{display:none!important}
.paper{position:relative;width:100%;max-width:820px;background:#fff;border-radius:6px;box-shadow:0 20px 44px -26px rgba(15,36,32,.6);padding:64px 72px 80px}
.docpage{font-family:Newsreader,Georgia,serif;color:#14211D}
.docpage h1{font:400 40px/1.1 Newsreader;letter-spacing:-.6px;color:#0F2420;margin-bottom:6px}
.docpage .meta{font:600 13px Karla;letter-spacing:1px;text-transform:uppercase;color:#A8832C;margin-bottom:26px}
.docpage h2{font:400 26px/1.2 Newsreader;color:#0F2420;margin:28px 0 10px}
.docpage p{font-size:18px;line-height:1.7;margin-bottom:12px}
.paper.editing [data-edit]{outline:none;border-radius:4px}.paper.editing [data-edit]:hover{box-shadow:0 0 0 3px rgba(201,169,78,.45)}.paper.editing [data-edit]:focus{box-shadow:0 0 0 4px #C9A94E}
.outl{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font:400 14px/1.25 Newsreader;color:var(--g);position:relative}
.outl.sel{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.outl .pr{font:700 9px Karla;color:var(--g);background:var(--brass);border-radius:8px;padding:1px 6px;margin-left:4px}
.kind{position:absolute;right:10px;top:10px;z-index:2;font:700 10px Karla;letter-spacing:1px;text-transform:uppercase;background:#fff;color:var(--g2);border-radius:100px;padding:3px 8px}
.aiset{display:inline-flex;align-items:center;gap:6px;border:1px solid #E7DAB2;background:#FFFCF3;border-radius:9px;padding:4px 8px;font-weight:700;font-size:12.5px;color:#7A5C17}
.aiset select{border:0;background:transparent;font-weight:700;color:#7A5C17;outline:none}

/* ================= v4 · responsive ================= */
#nav .burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--g)}
@media(max-width:860px){
 #nav{height:56px;padding:0 12px;gap:8px}
 #nav .logo b{font-size:18px}
 #nav .burger{display:inline-flex;align-items:center;justify-content:center;order:3}
 #nav .links{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px 12px;margin:0;box-shadow:0 18px 30px -24px rgba(15,36,32,.6)}
 #nav.open .links{display:flex}
 #nav .links a{padding:12px}
 .persona{padding:3px}.persona span{display:none}.persona .btn{padding:6px 9px;font-size:12px}
 .wrap{padding:24px 16px 64px}
 h1.big{font-size:38px!important;letter-spacing:-.8px}
 h2.t{font-size:26px}
 .lead{font-size:16px}
 .grid3,.grid4{grid-template-columns:1fr!important}
 .steps4{grid-template-columns:1fr;margin-top:32px}
 .hero{gap:24px}
 .cta,.cta .btn.xl{width:100%}.cta .btn.xl{padding:16px 18px;font-size:16px;white-space:normal}
 .sec-h{flex-wrap:wrap;margin-top:40px}
 .modal-bg{align-items:flex-end;padding:0}
 .modal{border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
 .modal .seg{display:flex;flex-wrap:wrap}
 .toast-wrap{left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom))}.toast{max-width:none}
 .card:has(table){overflow-x:auto}.card table{min-width:560px}
 .viewer{padding:10px;min-height:calc(100dvh - 56px)}
 .paper{padding:28px 20px 40px}
 .docpage h1{font-size:30px}.docpage p{font-size:17px}
}
@media(max-width:560px){.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.filters button{flex:none}}

/* room on phones and iPad portrait: slide strip, stage, bottom sheet */
.mbar,.sheet-h{display:none}
@media(max-width:860px){
 #room:not(.ide){display:flex;flex-direction:column;height:calc(100dvh - 56px)}
 #room:not(.ide) .rtop{flex:none;overflow-x:auto;scrollbar-width:none;gap:8px;padding:8px 10px}
 #room:not(.ide) .rtop::-webkit-scrollbar{display:none}
 #room:not(.ide) .rtop .ttl{max-width:150px;font-size:17px}
 #room:not(.ide) .rtop>*{flex:none}
 #room:not(.ide) .rleft{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px;height:74px}
 #room:not(.ide) .rleft>p{display:none}
 #room:not(.ide) .th2{width:100px;height:56px;aspect-ratio:auto}
 #room:not(.ide) .outl{min-width:150px;max-width:190px;font-size:13px}
 #room:not(.ide) .rcenter{flex:1;min-height:0;padding-bottom:calc(58px + env(safe-area-inset-bottom))}
 #room:not(.ide) .ctool{flex-wrap:wrap;padding:8px 10px}
 #room:not(.ide) .ctool .small{display:none}
 #room:not(.ide) .cwrap{padding:10px}
 #room:not(.ide) .banner{flex-wrap:wrap;padding:8px 12px;font-size:13px}
 #room:not(.ide) .rright{position:fixed;left:0;right:0;bottom:0;z-index:70;height:72dvh;border:0;border-radius:18px 18px 0 0;box-shadow:0 -24px 50px -20px rgba(15,36,32,.55);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
 #room.sheet:not(.ide) .rright{transform:none}
 #room:not(.ide) .sheet-h{display:flex;align-items:center;justify-content:center;position:relative;height:22px}
 #room:not(.ide) .sheet-h i{width:42px;height:5px;border-radius:3px;background:#D5DBD6}
 #room:not(.ide) .sheet-h button{position:absolute;right:10px;top:4px;font-size:20px;color:var(--mut);padding:4px 8px}
 #room:not(.ide) .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:65;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 #room:not(.ide) .mbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font:700 11px Karla;color:var(--mut)}
 #room:not(.ide) .mbar button b{font-size:17px;line-height:1}
 #room:not(.ide) .mbar button.on{color:var(--g);background:var(--tint)}
 #room:not(.ide) .mbar .bd2{margin:0 0 0 2px}
 .sheet-bg{position:fixed;inset:0;z-index:66;background:rgba(15,36,32,.25)}
}

/* ================= v4 · AI Studio (IDE) ================= */

var S={decks:[],events:[],loaded:false};
function tms(x){return x?Date.parse(x):now();}
function uname(u){if(USERS[u])return U(u).name;var e=S.events.filter(function(x){return x.user===u&&x.email})[0];return e?e.email:'Member';}
function mapProposal(r){return {id:r.id,author:r.author,via:r.via,prompt:r.prompt,files:r.files||{},status:r.status,t:tms(r.updated_at||r.created_at),saved:true,order:(r.slide_order&&r.slide_order.length)?r.slide_order:null,group:r.option_group||null,label:r.option_label||null};}
function mapVersion(r){return {n:r.n,t:tms(r.created_at),by:r.proposed_by,via:r.via,approvedBy:r.approved_by,msg:r.msg,snap:r.snap||{},changed:r.changed||[]};}
function threadComments(rows){var top=rows.filter(function(r){return !r.parent_id}).map(function(r){return {id:r.id,path:r.path,key:r.field,author:r.author,text:r.body,t:tms(r.created_at),resolved:!!r.resolved,applied:!!r.applied,replies:[]};});
 var by={};top.forEach(function(c){by[c.id]=c;});
 rows.filter(function(r){return r.parent_id}).sort(function(a,b){return tms(a.created_at)-tms(b.created_at)}).forEach(function(r){if(by[r.parent_id])by[r.parent_id].replies.push({id:r.id,author:r.author,text:r.body,t:tms(r.created_at)});});
 return top;}
function deck(id){return S.decks.filter(function(d){return d.id===id})[0];}
function upsertDeckRow(r){var d=deck(r.id);if(!d){d={id:r.id,proposals:[],comments:[],rawComments:[],versions:[],invites:[],presence:{},chat:[],full:false};S.decks.push(d);}
 d.name=r.name;d.kind=r.kind;d.tpl=r.tpl;d.ai=r.ai_mode;d.owner=r.owner;d.files=r.files||{};d.order=(r.slide_order&&r.slide_order.length)?r.slide_order:Object.keys(d.files);d.updated=tms(r.updated_at||r.created_at);return d;}
function userByEmail(em){return Object.keys(USERS).filter(function(k){return U(k).email===em})[0];}
function members(d){var m=[d.owner];(d.invites||[]).forEach(function(i){var p=userByEmail(i.email);if(p&&m.indexOf(p)<0)m.push(p);});return m;}
function myRole(d){if(!d||!ME)return null;if(d.owner===ME)return 'owner';var i=(d.invites||[]).filter(function(x){return x.email===MYEMAIL})[0];return i?i.role:null;}
function canEdit(d){var r=myRole(d);return r==='owner'||r==='editor';}
var DB={
 err:function(r,what){if(r&&r.error){console.error(what,r.error);toast('⚠ '+esc(what||'Error')+': '+esc(r.error.message||r.error),null,true);throw r.error;}return r?r.data:null;},
 profiles:function(){return sb.from('profiles').select('*').then(function(r){(DB.err(r,'Loading people')||[]).forEach(addUser);});},
 listDocs:function(){return Promise.all([sb.from('documents').select('*'),sb.from('invites').select('*'),DB.profiles(),sb.from('proposals').select('id,doc_id,status').eq('status','open')]).then(function(rs){
   var docs=DB.err(rs[0],'Loading documents')||[],inv=DB.err(rs[1],'Loading invites')||[],pr=DB.err(rs[3],'Loading proposals')||[];
   S.decks=S.decks.filter(function(d){return docs.some(function(x){return x.id===d.id})});
   docs.forEach(function(r){var d=upsertDeckRow(r);d.invites=inv.filter(function(i){return i.doc_id===r.id}).map(function(i){return {email:i.email,role:i.role}});
     if(!d.full)d.proposals=pr.filter(function(p){return p.doc_id===r.id}).map(function(p){return {id:p.id,status:'open',files:{},t:0,saved:true}});});
   S.decks.sort(function(a,b){return b.updated-a.updated});S.loaded=true;return S.decks;});},
 loadDoc:function(id){return Promise.all([sb.from('documents').select('*').eq('id',id),sb.from('proposals').select('*').eq('doc_id',id),sb.from('comments').select('*').eq('doc_id',id),sb.from('versions').select('*').eq('doc_id',id),sb.from('invites').select('*').eq('doc_id',id),DB.profiles()]).then(function(rs){
   var row=(DB.err(rs[0],'Loading document')||[])[0];if(!row)return null;var d=upsertDeckRow(row);
   var keep={};d.proposals.forEach(function(p){if(p.author===ME&&p.status==='open'&&p.pending)keep[p.id]=p;});
   d.proposals=(DB.err(rs[1],'Loading proposals')||[]).map(function(r){return keep[r.id]||mapProposal(r);});
   Object.keys(keep).forEach(function(k){if(!d.proposals.some(function(p){return p.id===k}))d.proposals.push(keep[k]);});
   d.rawComments=DB.err(rs[2],'Loading comments')||[];d.comments=threadComments(d.rawComments);
   d.versions=(DB.err(rs[3],'Loading versions')||[]).map(mapVersion).sort(function(a,b){return a.n-b.n});
   d.invites=(DB.err(rs[4],'Loading invites')||[]).map(function(i){return {email:i.email,role:i.role}});d.full=true;return d;});},
 createDoc:function(t,name,ai,emails,role){var files={};t.slides(name).forEach(function(h,i){files['s'+(i+1)]=h;});
   return sb.rpc('create_document',{p_name:name,p_kind:t.kind||'slides',p_tpl:t.id,p_ai:ai,p_files:files,p_order:Object.keys(files),p_emails:emails,p_role:role||'editor'}).then(function(r){return DB.err(r,'Creating');});},
 invite:function(d,email,role){email=email.toLowerCase().trim();return sb.from('invites').insert({doc_id:d.id,email:email,role:role}).then(function(r){DB.err(r,'Inviting');if(!d.invites.some(function(i){return i.email===email}))d.invites.push({email:email,role:role});track('invite',ME,d.id,{email:email,role:role});});},
 uninvite:function(d,email){return sb.from('invites').delete().eq('doc_id',d.id).eq('email',email).then(function(r){DB.err(r,'Removing access');d.invites=d.invites.filter(function(i){return i.email!==email});});},
 saveProposal:function(d,p){var ts=new Date().toISOString();p.pending=false;
   if(!p.saved){p.saved=true;return sb.from('proposals').insert({id:p.id,doc_id:d.id,author:p.author,via:p.via,prompt:p.prompt||null,files:p.files,status:'open'}).then(function(r){DB.err(r,'Saving proposal');});}
   return sb.from('proposals').update({files:p.files,prompt:p.prompt||null,status:p.status==='open'?'open':'withdrawn',updated_at:ts}).eq('id',p.id).then(function(r){DB.err(r,'Saving proposal');});},
 approve:function(pid){return sb.rpc('approve_proposal',{p_id:pid}).then(function(r){return DB.err(r,'Approving');});},
 reject:function(pid){return sb.rpc('reject_proposal',{p_id:pid}).then(function(r){return DB.err(r,'Rejecting');});},
 comment:function(c){return sb.from('comments').insert(c).then(function(r){DB.err(r,'Commenting');});},
 updComment:function(id,patch){return sb.from('comments').update(patch).eq('id',id).then(function(r){DB.err(r,'Updating comment');});},
 setAI:function(d,mode){return sb.from('documents').update({ai_mode:mode}).eq('id',d.id).then(function(r){DB.err(r,'Saving setting');});},
 events:function(days){return sb.from('events').select('*').gte('ts',new Date(now()-days*864e5).toISOString()).then(function(r){S.events=(DB.err(r,'Loading events')||[]).map(function(e){return {id:e.id,ts:tms(e.ts),type:e.type,user:e.user_id,email:e.email,deck:e.doc_id,meta:e.meta||{}};});return S.events;});}
};
/* save proposals in order, debounced while someone types */
var saveT={};
function scheduleSave(d,p,delay){p.pending=true;clearTimeout(saveT[p.id]);saveT[p.id]=setTimeout(function(){p._chain=(p._chain||Promise.resolve()).then(function(){return DB.saveProposal(d,p);}).catch(function(){});},delay==null?300:delay);}
function flushSave(d,p){clearTimeout(saveT[p.id]);p._chain=(p._chain||Promise.resolve()).then(function(){return p.pending||!p.saved?DB.saveProposal(d,p):null;});return p._chain;}
function track(type,user,deckId,meta){if(!sb||!ME)return;var row={user_id:ME,email:MYEMAIL,type:type,doc_id:deckId||null,meta:meta||{}};sb.from('events').insert(row).then(function(){},function(){});S.events.push({ts:now(),type:type,user:ME,email:MYEMAIL,deck:deckId||null,meta:meta||{}});}
function persist(){}
function toast(m,w,local){var el=document.getElementById('toasts'),d=document.createElement('div');d.className='toast';d.innerHTML=(w&&USERS[w]?av(w,'sm'):'')+'<span>'+m+'</span>';el.appendChild(d);setTimeout(function(){d.style.transition='opacity .4s';d.style.opacity='0'},4200);setTimeout(function(){d.remove()},4700);}
function online(d){return Object.keys(d.presence||{}).filter(function(k){return k!=='claude';});}
function openProps(d){return d.proposals.filter(function(p){return p.status==='open';});}
/* draft = approved files + all open proposals (latest wins) */
function draftFiles(d){var f=clone(d.files);openProps(d).filter(function(p){return !isVersion(p)}).sort(function(a,b){return a.t-b.t}).forEach(function(p){Object.keys(p.files).forEach(function(k){f[k]=p.files[k];});});return f;}
function texts(html){var m={},r=/data-edit="([^"]+)"[^>]*>([\s\S]*?)<\/(?:p|h1|h2)>/g,x;while((x=r.exec(html||'')))m[x[1]]=x[2];return m;}
function plain(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent;}

/* ---------- realtime: one channel per open document ---------- */
var CH=null,CHDOC=null,myPres={};
function subscribe(d){if(CH&&CHDOC===d.id)return;unsubscribe();if(!sb.channel)return;CHDOC=d.id;
 CH=sb.channel('doc:'+d.id,{config:{presence:{key:ME}}});
 ['proposals','comments','versions','invites'].forEach(function(t){CH.on('postgres_changes',{event:'*',schema:'public',table:t,filter:'doc_id=eq.'+d.id},function(pl){onRow(d,t,pl);});});
 CH.on('postgres_changes',{event:'UPDATE',schema:'public',table:'documents',filter:'id=eq.'+d.id},function(pl){if(pl.new)upsertDeckRow(pl.new);refresh({all:true,remote:true});});
 CH.on('presence',{event:'sync'},function(){var st=CH.presenceState(),pres={};Object.keys(st).forEach(function(k){var arr=st[k],m=arr[arr.length-1];if(!m)return;if(!USERS[k]&&m.email)addUser({id:k,name:m.name,email:m.email});pres[k]=Object.assign({},m,{t:now()});});d.presence=pres;refresh({presence:true});});
 CH.subscribe(function(status){if(status==='SUBSCRIBED')pushPres();});}
function unsubscribe(){if(CH){try{sb.removeChannel(CH);}catch(e){}CH=null;CHDOC=null;}}
var presT=null;
function pushPres(){if(!CH)return;clearTimeout(presT);presT=setTimeout(function(){try{CH.track(Object.assign({name:U(ME).name,email:MYEMAIL},myPres));}catch(e){}},150);}
function onRow(d,t,pl){var r=pl.new||{};var ev=pl.eventType;
 if(t==='proposals'){if(ev==='DELETE'||!r.id)return;var p=d.proposals.filter(function(x){return x.id===r.id})[0];var m=mapProposal(r);
   if(p){if(p.author===ME&&p.pending&&m.status==='open')return;Object.assign(p,m);}else{d.proposals.push(m);if(m.via==='mcp'&&RM)toast('✦ '+esc(U(m.author).short)+'’s AI is writing a proposal through the connector','claude');}
   refresh({edit:Object.keys(m.files)[0]||RM&&RM.path,remote:true});}
 else if(t==='comments'){if(!r.id)return;var i=-1;d.rawComments.forEach(function(x,k){if(x.id===r.id)i=k;});if(i>=0)d.rawComments[i]=r;else d.rawComments.push(r);d.comments=threadComments(d.rawComments);

  if(!r.ok)return r.text().then(function(t){var m=t;try{var j=JSON.parse(t);m=(j.error&&(j.error.message||j.error.type))||t;}catch(e){}throw new Error(r.status+' · '+m);});
  var rd=r.body.getReader(),dec=new TextDecoder(),buf='',full='';
  function pump(){return rd.read().then(function(x){if(x.done)return full;buf+=dec.decode(x.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
   lines.forEach(function(l){l=l.trim();if(l.indexOf('data:')!==0)return;var data=l.slice(5).trim();if(!data||data==='[DONE]')return;try{var j=JSON.parse(data);var t=c.provider==='claude'?(j.type==='content_block_delta'&&j.delta&&j.delta.text):(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content);if(t){full+=t;onText(full);}}catch(e){}});return pump();});}

 });

function hlHTML(s){return esc(s).replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w-]+)([\s\S]*?)(\/?&gt;)/g,function(m,cm,open,tag,attrs,close){if(cm)return '<span class="t-c">'+cm+'</span>';return '<span class="t-p">'+open+'</span><span class="t-t">'+tag+'</span>'+attrs.replace(/([\w:-]+)(=)(&quot;[\s\S]*?&quot;)/g,function(x,a,eq,v){return '<span class="t-a'+(a==='data-edit'?' t-e':'')+'">'+a+'</span>'+eq+'<span class="t-v">'+v+'</span>';})+'<span class="t-p">'+close+'</span>';});}
function lineDiff(a,b){a=a.split('\n');b=b.split('\n');var n=a.length,m=b.length;if(n*m>250000)return [{t:'d',s:'(file too large to diff)'}];
 var L=[];for(var i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}for(i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 var out=[];i=0;j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push({t:'s',s:a[i]});i++;j++;}else if(L[i+1][j]>=L[i][j+1]){out.push({t:'d',s:a[i]});i++;}else{out.push({t:'a',s:b[j]});j++;}}

 if(cands.length<2)cands=[doc.body];
 var force='<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden}.msx-slide{display:block!important;visibility:visible!important;opacity:1!important;transform:none!important;position:relative!important;left:0!important;top:0!important;width:1920px!important;min-height:1080px!important;margin:0!important}</style>';

/* ===================== v8: import from device, link (Drive, Docs, Dropbox, OneDrive, GitHub), clipboard, import links ===================== */
function fetchLink(url){var d=cur();
 if(!sb.functions||!sb.functions.invoke)return Promise.reject(new Error('Link import is not available in this build.'));
 return sb.functions.invoke('fetch-url',{body:{url:url,doc_id:d?d.id:null}}).then(function(r){
  if(r.error){var c=r.error.context;if(c&&c.json)return c.json().then(function(j){throw new Error(j.error||r.error.message);},function(){throw new Error(r.error.message);});throw new Error(r.error.message||String(r.error));}
  if(!r.data||!r.data.html)throw new Error((r.data&&r.data.error)||'Nothing came back from that link.');return r.data;});}
function importLinkFor(d,url){return location.origin+location.pathname+'#/import/'+d.id+'/'+encodeURIComponent(url);}
var _drawUpload7=drawUpload;
drawUpload=function(){var bg=document.getElementById('upModal');if(!bg)return;if(UP.step!==1)return _drawUpload7();var d=cur(),unit=d.kind==='doc'?'section':'slide';UP.src=UP.src||'device';
 var tabs='<div class="seg" style="margin:4px 0 14px;display:flex;flex-wrap:wrap"><button data-act="upSrc" data-v="device" class="'+(UP.src==='device'?'on':'')+'">Device or Drive</button><button data-act="upSrc" data-v="link" class="'+(UP.src==='link'?'on':'')+'">Link</button><button data-act="upSrc" data-v="paste" class="'+(UP.src==='paste'?'on':'')+'">Paste</button></div>';
 var body;
 if(UP.src==='device')body='<label class="upbox"><input type="file" id="upFile" accept=".html,.htm,text/html,text/plain" style="display:none"><b>Choose an HTML file</b><span class="small">Files, iCloud Drive, Google Drive, Dropbox or OneDrive (any app that shows up in Files)</span></label>';
 else if(UP.src==='link')body='<div class="field" style="margin:0"><label>Shared link</label><input class="in" id="upUrl" type="url" inputmode="url" placeholder="https://drive.google.com/file/d/… · Dropbox · OneDrive · GitHub · any public page" value="'+esc(UP.url||'')+'"></div>'+
  '<p class="small" style="margin:8px 0 0;line-height:1.5">Google Drive and Docs: share as “Anyone with the link”. Links to Drive, Google Docs, Dropbox, OneDrive and GitHub files are turned into direct downloads.</p>'+
  '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pri" data-act="upFetch">Import from link</button><button class="btn" data-act="upShareLink" title="A link that opens this document and imports the file">Copy import link</button></div>';
 else body='<textarea class="in" id="upPaste" rows="7" placeholder="&lt;!DOCTYPE html&gt;…" style="font:12px ui-monospace,Menlo,monospace">'+esc(UP.paste||'')+'</textarea><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" data-act="upClip">Paste from clipboard</button><button class="btn pri" data-act="upRead">Continue</button></div>';
 bg.innerHTML='<div class="modal" style="width:640px"><h2 class="t">Import a new version</h2><p class="muted" style="margin:6px 0 12px;line-height:1.5">Bring an HTML file made by Claude or anyone else: a full deck or a few '+unit+'s. You choose what it replaces, and it arrives as v'+(d.versions.length+1)+' for '+esc(U(d.owner).short)+' to approve.</p>'+tabs+body+
  '<p class="small" id="upMsg" style="min-height:18px;margin:10px 0 6px;color:#9A3B1B"></p><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px"><button class="btn" data-act="upPrompt">Copy prompt for Claude</button><button class="btn" data-act="close">Cancel</button></div></div>';
 var f=document.getElementById('upFile');if(f)f.onchange=function(){var file=f.files[0];if(!file)return;if(file.size>3e6){document.getElementById('upMsg').textContent='This file is larger than 3 MB.';return;}var r=new FileReader();r.onload=function(){UP.name=file.name;upParse(String(r.result));};r.readAsText(file);};
 var ui=document.getElementById('upUrl');if(ui){ui.oninput=function(){UP.url=ui.value;};ui.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();upFetch();}};}
 var tp=document.getElementById('upPaste');if(tp)tp.oninput=function(){UP.paste=tp.value;};
};
function upFetch(){var msg=document.getElementById('upMsg'),url=(UP.url||'').trim();if(!/^https?:\/\//i.test(url)){if(msg)msg.textContent='Paste a link that starts with https://';return;}
 var b=document.querySelector('[data-act="upFetch"]');if(b){b.disabled=true;b.textContent='Importing…';}if(msg){msg.style.color='var(--mut)';msg.textContent='Fetching the file…';}
 fetchLink(url).then(function(r){UP.name=r.name||url;upParse(r.html);track('import_link',ME,cur().id,{host:(url.match(/^https?:\/\/([^/]+)/)||[])[1]});}).catch(function(e){var m=document.getElementById('upMsg');if(m){m.style.color='#9A3B1B';m.textContent=e.message||String(e);}var b2=document.querySelector('[data-act="upFetch"]');if(b2){b2.disabled=false;b2.textContent='Import from link';}});}

/* import links: #/import/<doc>/<encoded url> opens the document and imports the file */
routes['#/import']=function(v,id,u){if(!requireAuth())return;try{sessionStorage.setItem('ms8-import',JSON.stringify({id:id,url:decodeURIComponent(u||'')}));}catch(e){}go('#/room/'+id);};
setInterval(function(){var p=null;try{p=JSON.parse(sessionStorage.getItem('ms8-import')||'null');}catch(e){}if(!p)return;var d=cur();if(!d||d.id!==p.id||route().name!=='#/room')return;
 try{sessionStorage.removeItem('ms8-import');}catch(e){}if(!canEdit(d)){toast('Only the owner and editors can import a version',ME,true);return;}openUpload();UP.src='link';UP.url=p.url;drawUpload();if(p.url)upFetch();},500);

document.addEventListener('click',function(e){
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act'),v=a.getAttribute('data-v'),d=cur();
 switch(act){
  case 'upSrc':e.stopPropagation();UP.src=v;drawUpload();break;
  case 'upFetch':e.stopPropagation();upFetch();break;

   navigator.clipboard.readText().then(function(t){UP.paste=t;var tp=document.getElementById('upPaste');if(tp)tp.value=t;if(/^https?:\/\/\S+$/.test((t||'').trim())){UP.src='link';UP.url=t.trim();drawUpload();upFetch();}},function(){document.getElementById('upMsg').textContent='Clipboard access was blocked. Long-press the box and choose Paste.';});break;
 }
},true);

document.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){e.preventDefault();var m=document.querySelector('.modal-bg');if(m)m.remove();go(g.getAttribute('data-go'));return;}
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act'),v=a.getAttribute('data-v'),d=cur();
 switch(act){

   DB.createDoc(tpl,nm,document.getElementById('mAI').value,ems,role).then(function(id){var mb=document.querySelector('.modal-bg');if(mb)mb.remove();toast(esc(nm)+' is ready',ME,true);go('#/room/'+id);if(ems.length)setTimeout(function(){var dd=deck(id);if(dd)openShareModal(dd);},900);}).catch(function(){a.disabled=false;a.textContent='Create and open the room';});break;
  case 'auMode':AU.mode=v;render();break;

  case 'signout':sb.auth.signOut().then(function(){setSession(null);unsubscribe();go('#/');});break;
  case 'shAdd':var se=(document.getElementById('shEmail').value||'').trim().toLowerCase(),sr=document.getElementById('shRole').value;if(!/@/.test(se)){alert('Type an e-mail');break;}DB.invite(d,se,sr).then(function(){document.querySelector('.modal-bg').redraw(se);refresh({all:true});}).catch(function(){});break;
  case 'shLink':var box=document.querySelector('.shl[data-e="'+v+'"]');if(box)box.innerHTML=box.innerHTML?'':shareLinksHTML(d,v);break;
  case 'shDel':if(confirm('Remove access for '+v+'?'))DB.uninvite(d,v).then(function(){document.querySelector('.modal-bg').redraw();refresh({all:true});}).catch(function(){});break;
  case 'copy':(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Link copied',null,true);},function(){prompt('Copy the link',v);});break;
  case 'pick':RM.path=v;RM.follow=null;pres({key:null});drawLeft();drawCenter();drawRight();break;
  case 'view':RM.view=v;drawCenter();drawLeft();break;
  case 'tab':if(RM.ide){if(v!=='ai'){RM.side=v;document.getElementById('room').classList.add('side-open');if(isMobile()){RM.pane='files';document.getElementById('room').dataset.pane='files';ideMtabs();}ideAct();ideSide();}else if(isMobile()){RM.pane='ai';document.getElementById('room').dataset.pane='ai';ideMtabs();drawRight();}break;}RM.tab=v;drawRight();if(isMobile())sheet(true);break;
  case 'follow':if(v===ME)break;RM.follow=v;var fp=d.presence[v];if(fp&&fp.path)RM.path=fp.path;drawLeft();drawCenter();drawRight();toast('Following '+U(v).short,v,true);break;
  case 'unfollow':RM.follow=null;drawTop();break;
  case 'present':var on=!(d.presence[ME]&&d.presence[ME].presenting);pres({presenting:on});toast(on?'You are presenting · others see a Follow banner':'You stopped presenting',ME,true);break;
  case 'share':openShareModal(d);break;
  case 'ai':var PRs=d.kind==='doc'?AIPD:AIP;runAI(PRs[+v][1],PRs[+v][0]+' ('+(d.kind==='doc'?'section':'slide')+' '+(d.order.indexOf(RM.path)+1)+')');break;
  case 'aiFree':var q=(RM.ask||'').trim();if(!q)break;RM.ask='';if(!canAI(d))break;if(aiConn()){realAI(d,RM.path,q,ME,aiConn());break;}var k=/span|espa/i.test(q)?'es':/short|tight|conc|curt/i.test(q)?'tighten':/academ|formal/i.test(q)?'academic':/cit|refer/i.test(q)?'cite':/question|provoc/i.test(q)?'provoke':(d.kind==='doc'?'tighten':'note');runAI(k,q);break;

  case 'cTest':var ct=readConn();var cm=document.getElementById('cMsg');if(!ct.key){cm.textContent='Paste an API key first.';break;}cm.textContent='Testing…';callAI(ct,'Reply with the single word OK.','Test',function(){}).then(function(t){cm.innerHTML='<span style="color:#1F7A4A">✓ Connected: '+AIDEF[ct.provider].label+' answered “'+esc(t.trim().slice(0,20))+'”.</span>';}).catch(function(err){cm.innerHTML='<span style="color:#9A3B1B">✗ '+esc(err.message||String(err))+'</span>';});break;
  case 'cSave':var cs=readConn();if(!cs.key){alert('Paste an API key.');break;}if(!document.getElementById('cOk').checked){alert('Confirm that the key belongs to your account with '+MYEMAIL+'.');break;}a.disabled=true;saveConn(cs).then(function(){track('ai_connect',ME,null,{provider:cs.provider,model:cs.model,email:cs.email,stored:'account'});var mb2=document.getElementById('cnModal');if(mb2)mb2.remove();toast(AIDEF[cs.provider].label+' saved to your account · '+esc(MYEMAIL),ME,true);if(RM){drawRight();if(RM.ide){ideTitle();ideStatus();}}}).catch(function(){a.disabled=false;});break;

  case 'applyAI':var cc=d.comments.filter(function(x){return x.id===v})[0];if(cc){var kk=/span|espa/i.test(cc.text)?'es':/concis|short|long|tight|curt/i.test(cc.text)?'tighten':/academ|formal/i.test(cc.text)?'academic':/cit|refer/i.test(cc.text)?'cite':/question|provoc/i.test(cc.text)?'provoke':(d.kind==='doc'?'tighten':'note');RM.path=cc.path;drawLeft();drawCenter();cc.applied=true;DB.updComment(cc.id,{applied:true}).catch(function(){});if(aiConn()){realAI(d,cc.path,'Apply this comment from '+U(cc.author).name+': '+cc.text,ME,aiConn());}else runAI(kk,'Apply '+U(cc.author).short+'’s comment: “'+cc.text.slice(0,70)+'”');}break;
