:root{--g:#0F2420;--g2:#1F5A4C;--teal:#2E8070;--brass:#C9A94E;--brass2:#A8832C;--ink:#14211D;--mut:#5E716A;--sub:#8FA79F;--line:#E2E6E1;--paper:#F8F6F1;--tint:#E2EEE8;--sand:#F5ECD3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Karla,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:14px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--g2)}
#nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:60px;padding:0 22px;background:rgba(248,246,241,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#nav .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--g)}
#nav .logo b{font:400 21px Newsreader;letter-spacing:-.3px}
#nav .links{display:flex;gap:2px;margin-left:8px}
#nav .links a{text-decoration:none;color:var(--mut);font-weight:700;padding:8px 12px;border-radius:9px}
#nav .links a.on{color:var(--g);background:var(--tint)}
#nav .sp{flex:1}
.persona{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 10px 4px 4px;font-weight:700}
.persona select{border:0;background:transparent;font-weight:700;outline:none;max-width:170px}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font:700 11px Karla;flex:none;position:relative;border:2px solid #fff}
.av.sm{width:24px;height:24px;font-size:9px}.av.lg{width:44px;height:44px;font-size:14px}
.av.on::after{content:'';position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#3BB273;border:2px solid #fff}
.av.ai{background:linear-gradient(135deg,#1F5A4C,#C9A94E)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--g);white-space:nowrap}
.btn:hover{border-color:#C9D3CE}.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.br{background:var(--brass);border-color:var(--brass);color:var(--g)}
.btn.ok{background:#1F7A4A;border-color:#1F7A4A;color:#fff}.btn.no{color:#9A3B1B}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}.btn.xl{padding:18px 28px;font-size:18px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--tint);color:var(--g2);font:700 10.5px Karla;letter-spacing:2px;text-transform:uppercase;padding:6px 12px 5px;border-radius:100px}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--brass)}
.live{display:inline-flex;align-items:center;gap:6px;font:700 11px Karla;letter-spacing:1px;text-transform:uppercase;color:#C0392B}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#E0533D;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,83,61,.5)}70%{box-shadow:0 0 0 8px rgba(224,83,61,0)}100%{box-shadow:0 0 0 0 rgba(224,83,61,0)}}
.pill{display:inline-block;font:700 11px Karla;padding:3px 9px;border-radius:100px;background:#F1F3EF;color:var(--mut)}
.pill.ok{background:#E2F3E9;color:#1F7A4A}.pill.warn{background:var(--sand);color:#8A6A1F}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 34px -26px rgba(15,36,32,.5)}
.wrap{max-width:1200px;margin:0 auto;padding:40px 28px 80px}
h1.big{font:400 58px/1.03 Newsreader;letter-spacing:-1.6px;color:var(--g)}
h2.t{font:400 32px/1.1 Newsreader;color:var(--g)}h3.t{font:400 21px/1.2 Newsreader;color:var(--g)}
.lead{font-size:18px;line-height:1.55;color:var(--mut);max-width:620px}
.muted{color:var(--mut)}.small{font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:980px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
.toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--g);color:#EDEDE7;border-radius:12px;padding:11px 15px;max-width:380px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,36,32,.38);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:540px;max-width:100%;background:#fff;border-radius:18px;padding:26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font:700 11px Karla;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.in{width:100%;border:1px solid #D6DCD7;border-radius:10px;padding:10px 12px;outline:none;background:#fff;resize:vertical}
.in:focus{border-color:var(--g2);box-shadow:0 0 0 3px var(--tint)}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--g);border-radius:10px}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* HOME */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding-top:10px}
@media(max-width:980px){.hero{grid-template-columns:1fr}}
.hero h1 i{color:var(--brass2)}

<script>/* Test double for the subset of supabase-js used by Meridiano Studio.
   Tables live in localStorage and changes are broadcast to other tabs,
   so two pages behave like two people on different devices. */
(function(){
 var KEY='mock-sb-db',bc=new BroadcastChannel('mock-sb');

 var authCbs=[];
 function uid(){return crypto.randomUUID();}
 function me(){return session&&session.user;}
 function myEmail(){return me()?me().email:'';}
 function role(docId){var d=db.documents.filter(function(x){return x.id===docId})[0];if(!d)return null;if(me()&&d.owner===me().id)return 'owner';var i=db.invites.filter(function(x){return x.doc_id===docId&&x.email===myEmail()})[0];return i?i.role:null;}
 function visible(t,r){if(t==='ai_keys')return !!(me()&&r.user_id===me().id);if(t==='documents')return !!role(r.id);if(['invites','proposals','comments','versions'].indexOf(t)>=0)return !!role(r.doc_id);if(t==='events')return me()&&(r.user_id===me().id||(r.doc_id&&role(r.doc_id)==='owner'));return true;}
 var channels=[];
 function emit(t,ev,row){var msg={kind:'pg',table:t,eventType:ev,new:row};bc.postMessage(msg);deliver(msg);}
 function deliver(msg){reload();channels.forEach(function(c){c._pg.forEach(function(h){if(h.table!==msg.table)return;if(h.event!=='*'&&h.event!==msg.eventType)return;var f=h.filter&&h.filter.match(/^(\w+)=eq\.(.+)$/);if(f&&String(msg.new[f[1]])!==f[2])return;if(!visible(msg.table,msg.new))return;setTimeout(function(){h.cb({eventType:msg.eventType,new:msg.new});},5);});});}
 bc.onmessage=function(e){var m=e.data;if(m.kind==='pg')deliver(m);if(m.kind==='pres')presRecv(m);};
 function Q(table){this.t=table;this.f=[];this.op='select';}

 Q.prototype.in=function(c,v){this.f.push(function(r){return v.indexOf(r[c])>=0});return this;};

  if(!me())return {data:null,error:{message:'not signed in'}};
  if(this.op==='select'){var out=rows.filter(function(r){return visible(t,r)&&self.f.every(function(f){return f(r)})});return {data:this.one?out[0]:out,error:null};}
  if(this.op==='insert'){var arr=[].concat(this.row);for(var i=0;i<arr.length;i++){var r=Object.assign({},arr[i]);r.id=r.id||(t==='events'?rows.length+1:uid());r.created_at=r.created_at||ts;if(t==='events')r.ts=ts;if(t==='proposals'){r.updated_at=ts;var rl=role(r.doc_id);if(rl!=='owner'&&rl!=='editor')return {data:null,error:{message:'new row violates row-level security policy for table "proposals"'}};}
    if(t==='comments'&&!role(r.doc_id))return {data:null,error:{message:'rls'}};if(t==='invites'&&role(r.doc_id)!=='owner')return {data:null,error:{message:'rls'}};if(t==='ai_keys'&&(r.email!==myEmail()||r.user_id!==me().id))return {data:null,error:{message:'new row violates row-level security policy for table "ai_keys"'}};
    if(t==='comments'){r.resolved=!!r.resolved;r.applied=!!r.applied;}rows.push(r);save();emit(t,'INSERT',r);}return {data:arr,error:null};}
  if(this.op==='update'){var hit=rows.filter(function(r){return visible(t,r)&&self.f.every(function(f){return f(r)})});hit.forEach(function(r){Object.assign(r,self.row);if(t==='documents')r.updated_at=ts;save();emit(t,'UPDATE',r);});return {data:hit,error:null};}
  if(this.op==='delete'){rows=db[t];db[t]=rows.filter(function(r){return !(visible(t,r)&&self.f.every(function(f){return f(r)}))});save();return {data:null,error:null};}
 };
 function rpc(name,a){return new Promise(function(r){setTimeout(function(){reload();var ts=new Date().toISOString();
  if(name==='invite_status'){var ok=db.invites.some(function(i){return i.doc_id===a.p_doc&&i.email===a.p_email.toLowerCase()});return r({data:ok?'invited':'not_invited',error:null});}
  if(!me())return r({data:null,error:{message:'not signed in'}});
  if(name==='create_document'){var id=uid();var d={id:id,name:a.p_name,kind:a.p_kind,tpl:a.p_tpl,owner:me().id,ai_mode:a.p_ai,files:a.p_files,slide_order:a.p_order,created_at:ts,updated_at:ts};db.documents.push(d);
   db.versions.push({id:uid(),doc_id:id,n:1,msg:'Created from template '+a.p_tpl,proposed_by:me().id,approved_by:me().id,via:'human',snap:a.p_files,changed:Object.keys(a.p_files),created_at:ts});
   (a.p_emails||[]).forEach(function(e){db.invites.push({doc_id:id,email:e.toLowerCase(),role:a.p_role,created_at:ts});});save();return r({data:id,error:null});}
  if(name==='approve_proposal'){var p=db.proposals.filter(function(x){return x.id===a.p_id})[0];if(!p)return r({data:null,error:{message:'proposal not found'}});if(role(p.doc_id)!=='owner')return r({data:null,error:{message:'only the owner can approve'}});
   var d2=db.documents.filter(function(x){return x.id===p.doc_id})[0];Object.assign(d2.files,p.files);if(p.slide_order&&p.slide_order.length)d2.slide_order=p.slide_order;d2.updated_at=ts;var n=db.versions.filter(function(v){return v.doc_id===p.doc_id}).length+1;
   var v={id:uid(),doc_id:p.doc_id,n:n,msg:p.prompt||'Edits',proposed_by:p.author,via:p.via,approved_by:me().id,snap:JSON.parse(JSON.stringify(d2.files)),changed:Object.keys(p.files),created_at:ts};db.versions.push(v);p.status='approved';p.decided_by=me().id;var sib=[];if(p.option_group)db.proposals.forEach(function(q){if(q.option_group===p.option_group&&q.id!==p.id&&q.status==='open'){q.status='rejected';sib.push(q);}});save();sib.forEach(function(q){emit('proposals','UPDATE',q);});
   emit('documents','UPDATE',d2);emit('versions','INSERT',v);emit('proposals','UPDATE',p);return r({data:n,error:null});}
  if(name==='reject_proposal'){var p2=db.proposals.filter(function(x){return x.id===a.p_id})[0];if(p2){p2.status=role(p2.doc_id)==='owner'?'rejected':'withdrawn';save();emit('proposals','UPDATE',p2);}return r({data:null,error:null});}
  r({data:null,error:{message:'unknown rpc'}});},10);});}
 var pres={};
 function presRecv(m){channels.forEach(function(c){if(c.name!==m.ch)return;if(m.leave)delete c._state[m.key];else c._state[m.key]=[m.meta];c._sync.forEach(function(cb){setTimeout(cb,5)});});}

  c.on=function(type,f,cb){if(type==='postgres_changes')c._pg.push({table:f.table,event:f.event,filter:f.filter,cb:cb});if(type==='presence')c._sync.push(cb);return c;};
  c.subscribe=function(cb){channels.push(c);setTimeout(function(){cb&&cb('SUBSCRIBED');bc.postMessage({kind:'presreq',ch:name});},20);return c;};
  c.track=function(meta){var m={kind:'pres',ch:name,key:c.key,meta:meta};c._last=m;presRecv(m);bc.postMessage(m);return Promise.resolve();};
  c.presenceState=function(){return c._state;};
  return c;}
 bc.addEventListener('message',function(e){if(e.data.kind==='presreq')channels.forEach(function(c){if(c.name===e.data.ch&&c._last)bc.postMessage(c._last);});});
 window.__SB_MOCK={
  from:function(t){return new Q(t);},rpc:rpc,channel:channel,removeChannel:function(c){channels=channels.filter(function(x){return x!==c});if(c.key)bc.postMessage({kind:'pres',ch:c.name,key:c.key,leave:true});},
  auth:{
   getSession:function(){return Promise.resolve({data:{session:session}});},
   onAuthStateChange:function(cb){authCbs.push(cb);return {data:{subscription:{unsubscribe:function(){}}}};},
   signUp:function(o){return new Promise(function(r){setTimeout(function(){reload();var em=o.email.toLowerCase();if(db.users.some(function(u){return u.email===em}))return r({data:{},error:{message:'User already registered'}});var u={id:uid(),email:em,pw:o.password,user_metadata:(o.options&&o.options.data)||{}};db.users.push(u);db.profiles.push({id:u.id,email:em,name:u.user_metadata.name||em.split('@')[0]});save();session={user:{id:u.id,email:em,user_metadata:u.user_metadata}};sessionStorage.setItem('mock-sess',JSON.stringify(session));authCbs.forEach(function(cb){cb('SIGNED_IN',session)});r({data:{session:session,user:session.user},error:null});},10);});},
   signInWithPassword:function(o){return new Promise(function(r){setTimeout(function(){reload();var u=db.users.filter(function(x){return x.email===o.email.toLowerCase()&&x.pw===o.password})[0];if(!u)return r({data:{},error:{message:'Invalid login credentials'}});session={user:{id:u.id,email:u.email,user_metadata:u.user_metadata}};sessionStorage.setItem('mock-sess',JSON.stringify(session));authCbs.forEach(function(cb){cb('SIGNED_IN',session)});r({data:{session:session},error:null});},10);});},
   signOut:function(){session=null;sessionStorage.removeItem('mock-sess');authCbs.forEach(function(cb){cb('SIGNED_OUT',null)});return Promise.resolve({error:null});}
  }};

function ago(t){if(!t)return '';var s=Math.round((now()-t)/1000);if(s<10)return 'just now';if(s<60)return s+'s ago';var m=Math.round(s/60);if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago';}

/* ---------- data layer (Supabase) ---------- */
var S={decks:[],events:[],loaded:false};
function tms(x){return x?Date.parse(x):now();}
function uname(u){if(USERS[u])return U(u).name;var e=S.events.filter(function(x){return x.user===u&&x.email})[0];return e?e.email:'Member';}
function mapProposal(r){return {id:r.id,author:r.author,via:r.via,prompt:r.prompt,files:r.files||{},status:r.status,t:tms(r.updated_at||r.created_at),saved:true,order:(r.slide_order&&r.slide_order.length)?r.slide_order:null,group:r.option_group||null,label:r.option_label||null};}
function mapVersion(r){return {n:r.n,t:tms(r.created_at),by:r.proposed_by,via:r.via,approvedBy:r.approved_by,msg:r.msg,snap:r.snap||{},changed:r.changed||[]};}
function threadComments(rows){var top=rows.filter(function(r){return !r.parent_id}).map(function(r){return {id:r.id,path:r.path,key:r.field,author:r.author,text:r.body,t:tms(r.created_at),resolved:!!r.resolved,applied:!!r.applied,replies:[]};});
 var by={};top.forEach(function(c){by[c.id]=c;});
 rows.filter(function(r){return r.parent_id}).sort(function(a,b){return tms(a.created_at)-tms(b.created_at)}).forEach(function(r){if(by[r.parent_id])by[r.parent_id].replies.push({id:r.id,author:r.author,text:r.body,t:tms(r.created_at)});});
 return top;}
function deck(id){return S.decks.filter(function(d){return d.id===id})[0];}
function upsertDeckRow(r){var d=deck(r.id);if(!d){d={id:r.id,proposals:[],comments:[],rawComments:[],versions:[],invites:[],presence:{},chat:[],full:false};S.decks.push(d);}
 d.name=r.name;d.kind=r.kind;d.tpl=r.tpl;d.ai=r.ai_mode;d.owner=r.owner;d.files=r.files||{};d.order=(r.slide_order&&r.slide_order.length)?r.slide_order:Object.keys(d.files);d.updated=tms(r.updated_at||r.created_at);return d;}
function userByEmail(em){return Object.keys(USERS).filter(function(k){return U(k).email===em})[0];}
function members(d){var m=[d.owner];(d.invites||[]).forEach(function(i){var p=userByEmail(i.email);if(p&&m.indexOf(p)<0)m.push(p);});return m;}
function myRole(d){if(!d||!ME)return null;if(d.owner===ME)return 'owner';var i=(d.invites||[]).filter(function(x){return x.email===MYEMAIL})[0];return i?i.role:null;}
function canEdit(d){var r=myRole(d);return r==='owner'||r==='editor';}
var DB={
 err:function(r,what){if(r&&r.error){console.error(what,r.error);toast('⚠ '+esc(what||'Error')+': '+esc(r.error.message||r.error),null,true);throw r.error;}return r?r.data:null;},
 profiles:function(){return sb.from('profiles').select('*').then(function(r){(DB.err(r,'Loading people')||[]).forEach(addUser);});},
 listDocs:function(){return Promise.all([sb.from('documents').select('*'),sb.from('invites').select('*'),DB.profiles(),sb.from('proposals').select('id,doc_id,status').eq('status','open')]).then(function(rs){
   var docs=DB.err(rs[0],'Loading documents')||[],inv=DB.err(rs[1],'Loading invites')||[],pr=DB.err(rs[3],'Loading proposals')||[];
   S.decks=S.decks.filter(function(d){return docs.some(function(x){return x.id===d.id})});
   docs.forEach(function(r){var d=upsertDeckRow(r);d.invites=inv.filter(function(i){return i.doc_id===r.id}).map(function(i){return {email:i.email,role:i.role}});
     if(!d.full)d.proposals=pr.filter(function(p){return p.doc_id===r.id}).map(function(p){return {id:p.id,status:'open',files:{},t:0,saved:true}});});
   S.decks.sort(function(a,b){return b.updated-a.updated});S.loaded=true;return S.decks;});},
 loadDoc:function(id){return Promise.all([sb.from('documents').select('*').eq('id',id),sb.from('proposals').select('*').eq('doc_id',id),sb.from('comments').select('*').eq('doc_id',id),sb.from('versions').select('*').eq('doc_id',id),sb.from('invites').select('*').eq('doc_id',id),DB.profiles()]).then(function(rs){
   var row=(DB.err(rs[0],'Loading document')||[])[0];if(!row)return null;var d=upsertDeckRow(row);
   var keep={};d.proposals.forEach(function(p){if(p.author===ME&&p.status==='open'&&p.pending)keep[p.id]=p;});
   d.proposals=(DB.err(rs[1],'Loading proposals')||[]).map(function(r){return keep[r.id]||mapProposal(r);});
   Object.keys(keep).forEach(function(k){if(!d.proposals.some(function(p){return p.id===k}))d.proposals.push(keep[k]);});
   d.rawComments=DB.err(rs[2],'Loading comments')||[];d.comments=threadComments(d.rawComments);
   d.versions=(DB.err(rs[3],'Loading versions')||[]).map(mapVersion).sort(function(a,b){return a.n-b.n});
   d.invites=(DB.err(rs[4],'Loading invites')||[]).map(function(i){return {email:i.email,role:i.role}});d.full=true;return d;});},
 createDoc:function(t,name,ai,emails,role){var files={};t.slides(name).forEach(function(h,i){files['s'+(i+1)]=h;});
   return sb.rpc('create_document',{p_name:name,p_kind:t.kind||'slides',p_tpl:t.id,p_ai:ai,p_files:files,p_order:Object.keys(files),p_emails:emails,p_role:role||'editor'}).then(function(r){return DB.err(r,'Creating');});},
 invite:function(d,email,role){email=email.toLowerCase().trim();return sb.from('invites').insert({doc_id:d.id,email:email,role:role}).then(function(r){DB.err(r,'Inviting');if(!d.invites.some(function(i){return i.email===email}))d.invites.push({email:email,role:role});track('invite',ME,d.id,{email:email,role:role});});},
 uninvite:function(d,email){return sb.from('invites').delete().eq('doc_id',d.id).eq('email',email).then(function(r){DB.err(r,'Removing access');d.invites=d.invites.filter(function(i){return i.email!==email});});},
 saveProposal:function(d,p){var ts=new Date().toISOString();p.pending=false;
   if(!p.saved){p.saved=true;return sb.from('proposals').insert({id:p.id,doc_id:d.id,author:p.author,via:p.via,prompt:p.prompt||null,files:p.files,status:'open'}).then(function(r){DB.err(r,'Saving proposal');});}
   return sb.from('proposals').update({files:p.files,prompt:p.prompt||null,status:p.status==='open'?'open':'withdrawn',updated_at:ts}).eq('id',p.id).then(function(r){DB.err(r,'Saving proposal');});},
 approve:function(pid){return sb.rpc('approve_proposal',{p_id:pid}).then(function(r){return DB.err(r,'Approving');});},
 reject:function(pid){return sb.rpc('reject_proposal',{p_id:pid}).then(function(r){return DB.err(r,'Rejecting');});},
 comment:function(c){return sb.from('comments').insert(c).then(function(r){DB.err(r,'Commenting');});},
 updComment:function(id,patch){return sb.from('comments').update(patch).eq('id',id).then(function(r){DB.err(r,'Updating comment');});},
 setAI:function(d,mode){return sb.from('documents').update({ai_mode:mode}).eq('id',d.id).then(function(r){DB.err(r,'Saving setting');});},
 events:function(days){return sb.from('events').select('*').gte('ts',new Date(now()-days*864e5).toISOString()).then(function(r){S.events=(DB.err(r,'Loading events')||[]).map(function(e){return {id:e.id,ts:tms(e.ts),type:e.type,user:e.user_id,email:e.email,deck:e.doc_id,meta:e.meta||{}};});return S.events;});}

/* save proposals in order, debounced while someone types */
var saveT={};
function scheduleSave(d,p,delay){p.pending=true;clearTimeout(saveT[p.id]);saveT[p.id]=setTimeout(function(){p._chain=(p._chain||Promise.resolve()).then(function(){return DB.saveProposal(d,p);}).catch(function(){});},delay==null?300:delay);}
function flushSave(d,p){clearTimeout(saveT[p.id]);p._chain=(p._chain||Promise.resolve()).then(function(){return p.pending||!p.saved?DB.saveProposal(d,p):null;});return p._chain;}
function track(type,user,deckId,meta){if(!sb||!ME)return;var row={user_id:ME,email:MYEMAIL,type:type,doc_id:deckId||null,meta:meta||{}};sb.from('events').insert(row).then(function(){},function(){});S.events.push({ts:now(),type:type,user:ME,email:MYEMAIL,deck:deckId||null,meta:meta||{}});}
function persist(){}
function toast(m,w,local){var el=document.getElementById('toasts'),d=document.createElement('div');d.className='toast';d.innerHTML=(w&&USERS[w]?av(w,'sm'):'')+'<span>'+m+'</span>';el.appendChild(d);setTimeout(function(){d.style.transition='opacity .4s';d.style.opacity='0'},4200);setTimeout(function(){d.remove()},4700);}
function online(d){return Object.keys(d.presence||{}).filter(function(k){return k!=='claude';});}
function openProps(d){return d.proposals.filter(function(p){return p.status==='open';});}
/* draft = approved files + all open proposals (latest wins) */
function draftFiles(d){var f=clone(d.files);openProps(d).filter(function(p){return !isVersion(p)}).sort(function(a,b){return a.t-b.t}).forEach(function(p){Object.keys(p.files).forEach(function(k){f[k]=p.files[k];});});return f;}
function texts(html){var m={},r=/data-edit="([^"]+)"[^>]*>([\s\S]*?)<\/(?:p|h1|h2)>/g,x;while((x=r.exec(html||'')))m[x[1]]=x[2];return m;}
function plain(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent;}

/* ---------- realtime: one channel per open document ---------- */
var CH=null,CHDOC=null,myPres={};
function subscribe(d){if(CH&&CHDOC===d.id)return;unsubscribe();if(!sb.channel)return;CHDOC=d.id;
 CH=sb.channel('doc:'+d.id,{config:{presence:{key:ME}}});
 ['proposals','comments','versions','invites'].forEach(function(t){CH.on('postgres_changes',{event:'*',schema:'public',table:t,filter:'doc_id=eq.'+d.id},function(pl){onRow(d,t,pl);});});
 CH.on('postgres_changes',{event:'UPDATE',schema:'public',table:'documents',filter:'id=eq.'+d.id},function(pl){if(pl.new)upsertDeckRow(pl.new);refresh({all:true,remote:true});});
 CH.on('presence',{event:'sync'},function(){var st=CH.presenceState(),pres={};Object.keys(st).forEach(function(k){var arr=st[k],m=arr[arr.length-1];if(!m)return;if(!USERS[k]&&m.email)addUser({id:k,name:m.name,email:m.email});pres[k]=Object.assign({},m,{t:now()});});d.presence=pres;refresh({presence:true});});
 CH.subscribe(function(status){if(status==='SUBSCRIBED')pushPres();});}
function unsubscribe(){if(CH){try{sb.removeChannel(CH);}catch(e){}CH=null;CHDOC=null;}}
var presT=null;
function pushPres(){if(!CH)return;clearTimeout(presT);presT=setTimeout(function(){try{CH.track(Object.assign({name:U(ME).name,email:MYEMAIL},myPres));}catch(e){}},150);}
function onRow(d,t,pl){var r=pl.new||{};var ev=pl.eventType;
 if(t==='proposals'){if(ev==='DELETE'||!r.id)return;var p=d.proposals.filter(function(x){return x.id===r.id})[0];var m=mapProposal(r);
   if(p){if(p.author===ME&&p.pending&&m.status==='open')return;Object.assign(p,m);}else{d.proposals.push(m);if(m.via==='mcp'&&RM)toast('✦ '+esc(U(m.author).short)+'’s AI is writing a proposal through the connector','claude');}
   refresh({edit:Object.keys(m.files)[0]||RM&&RM.path,remote:true});}
 else if(t==='comments'){if(!r.id)return;var i=-1;d.rawComments.forEach(function(x,k){if(x.id===r.id)i=k;});if(i>=0)d.rawComments[i]=r;else d.rawComments.push(r);d.comments=threadComments(d.rawComments);
   if(ev==='INSERT'&&r.author!==ME&&RM)toast(esc(U(r.author).short)+' commented: “'+esc(String(r.body).slice(0,70))+'”',r.author);refresh({comments:true});}
 else if(t==='versions'){if(r.n&&!d.versions.some(function(v){return v.n===r.n})){d.versions.push(mapVersion(r));d.versions.sort(function(a,b){return a.n-b.n});if(r.approved_by!==ME)toast('✓ Version v'+r.n+' approved',r.approved_by);}
   sb.from('documents').select('*').eq('id',d.id).then(function(x){var row=(x.data||[])[0];if(row)upsertDeckRow(row);refresh({all:true,remote:true});});}
 else if(t==='invites'){DB.loadDoc(d.id).then(function(){refresh({all:true});});}
}

function pad2(n){return (n<10?'0':'')+n;}
function slug(t){return (plain(t||'')||'untitled').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,22)||'untitled';}
function fileOf(d,k){var i=d.order.indexOf(k),T=texts(draftFiles(d)[k]||'');return (d.kind==='doc'?'sections/':'slides/')+pad2(i+1)+'-'+slug(T.h||T.title||T.eyebrow||k)+'.html';}
function baseName(f){return f.split('/').pop();}
function hlHTML(s){return esc(s).replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w-]+)([\s\S]*?)(\/?&gt;)/g,function(m,cm,open,tag,attrs,close){if(cm)return '<span class="t-c">'+cm+'</span>';return '<span class="t-p">'+open+'</span><span class="t-t">'+tag+'</span>'+attrs.replace(/([\w:-]+)(=)(&quot;[\s\S]*?&quot;)/g,function(x,a,eq,v){return '<span class="t-a'+(a==='data-edit'?' t-e':'')+'">'+a+'</span>'+eq+'<span class="t-v">'+v+'</span>';})+'<span class="t-p">'+close+'</span>';});}
function lineDiff(a,b){a=a.split('\n');b=b.split('\n');var n=a.length,m=b.length;if(n*m>250000)return [{t:'d',s:'(file too large to diff)'}];
 var L=[];for(var i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}for(i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 var out=[];i=0;j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push({t:'s',s:a[i]});i++;j++;}else if(L[i+1][j]>=L[i][j+1]){out.push({t:'d',s:a[i]});i++;}else{out.push({t:'a',s:b[j]});j++;}}
 while(i<n)out.push({t:'d',s:a[i++]});while(j<m)out.push({t:'a',s:b[j++]});return out;}
function fieldDiffs(d,k){var A=texts(d.files[k]||''),D=texts(draftFiles(d)[k]||'');return Object.keys(D).filter(function(f){return D[f]!==A[f]}).map(function(f){return {f:f,a:plain(A[f]||''),b:plain(D[f])}});}

 (op.edit||[]).forEach(function(e){var k=keyOf(+e.slide),h=cleanHTML(e.html||'').trim();if(!k)errs.push('slide '+e.slide+' does not exist');else if(h)files[k]=h;});
 var list=order.slice(),drop={};(op.remove||[]).forEach(function(n){var k=keyOf(+n);if(k)drop[k]=1;});list=list.filter(function(k){return !drop[k]});
 (op.move||[]).forEach(function(m){var k=keyOf(+m.slide);if(!k||drop[k])return;list=list.filter(function(x){return x!==k});var a=+m.after||0,ak=keyOf(a);var i=a===0?0:(ak&&list.indexOf(ak)>=0?list.indexOf(ak)+1:list.length);list.splice(i,0,k);});
 var last={};(op.add||[]).forEach(function(n){var h=cleanHTML(n.html||'').trim();if(!h)return;var k='s'+uuid().replace(/-/g,'').slice(0,8);files[k]=h;var a=+n.after||0;var anchor=last[a]!==undefined?last[a]:(a===0?null:keyOf(a));var i=anchor===null?0:(anchor&&list.indexOf(anchor)>=0?list.indexOf(anchor)+1:list.length);list.splice(i,0,k);last[a]=k;});
 var structural=(op.add||[]).length||(op.remove||[]).length||(op.move||[]).length;return {files:files,order:structural?list:null,errs:errs};}
function aiDesign(mode,instr){
 var d=cur(),c=aiConn();if(!d)return;if(!canAI(d)){toast('The owner set AI to owner only',ME,true);return;}
 if(!c){openConnect(CONN_LAST?'key':'connector');return;}
 var n=d.order.indexOf(RM.path)+1,df=draftFiles(d),unit=d.kind==='doc'?'section':'slide';
 var ask={redesign:'Redesign '+unit+' '+n+': stronger layout and hierarchy, same message. Return 1 option editing '+unit+' '+n+'.',options:'Give 3 clearly different layout options for '+unit+' '+n+' (labels A, B, C), each editing only '+unit+' '+n+'.',add:'Add one new '+unit+' right after '+unit+' '+n+' that moves the story forward. Return 1 option using "add" with after='+n+'.',deck:'Read the open comments and propose ONE new version of the deck that addresses them: redesign, add, remove or move '+unit+'s as needed.'}[mode];
 var comments=d.comments.filter(function(x){return !x.resolved}).map(function(x){return '- '+unit+' '+(d.order.indexOf(x.path)+1)+' · '+U(x.author).short+': '+x.text;}).join('\n');
 var deckTxt=d.order.map(function(k,i){var T=texts(df[k]),o=[];Object.keys(T).forEach(function(f){o.push(f+': '+plain(T[f]).slice(0,160))});return unit+' '+(i+1)+' — '+o.join(' | ');}).join('\n');
 var htmls=mode==='deck'?d.order.slice(0,12).map(function(k,i){return '### '+unit+' '+(i+1)+'\n'+df[k];}).join('\n\n'):'### '+unit+' '+n+' (current HTML)\n'+df[RM.path];
 var sys='You are the design and writing assistant of Meridiano Studio (Meridiano Consulting: statistics, data and AI; strongest in the credit cycle). You produce NEW VERSIONS of '+unit+'s as HTML, for the owner to approve.\n'+(d.kind==='doc'?GUIDE_DOCS_FE:GUIDE_SLIDES_FE)+'\nReply with ONLY a JSON object, no code fences: {"reply":"one or two sentences to the team","options":[{"label":"A","summary":"one line","edit":[{"slide":N,"html":"..."}],"add":[{"after":N,"html":"..."}],"remove":[N],"move":[{"slide":N,"after":M}]}]}. Omit empty arrays. Numbers refer to the current order.';
 var user='Document: '+d.name+' ('+(d.kind==='doc'?'long-form text':'presentation')+', '+d.order.length+' '+unit+'s)\nOutline:\n'+deckTxt+'\n\n'+htmls+(comments?'\n\nOpen comments:\n'+comments:'')+'\n\nTask from '+U(ME).name+': '+ask+(instr?'\nExtra instruction: '+instr:'');
 var label=(AIMODES.filter(function(m){return m[0]===mode})[0]||['',''])[1]+(instr?' · '+instr:'')+' ('+unit+' '+n+')';
 d.chat.push({who:ME,html:esc(label),t:now()});var msg={who:'claude',html:'<i>'+AIDEF[c.provider].label+' is designing…</i>',t:now(),prov:c.provider};d.chat.push(msg);
 track('ai_request',ME,d.id,{prompt:label,provider:c.provider,model:c.model,mode:mode,real:true});if(RM.ide)ideOut('→ '+AIDEF[c.provider].label+' · '+c.model+' · '+label,'warn');
 d.presence.claude={path:RM.path,t:now(),typing:now()};RM.tab='ai';drawRight();
 var cc=Object.assign({},c,{maxTokens:mode==='deck'?16000:(mode==='options'?12000:6000)});
 callAI(cc,sys,user,function(full){if(window.ideStream)ideStream(full,c);msg.html='<p class="small" style="margin-bottom:3px">'+AIDEF[c.provider].label+' · designing · '+full.length+' characters</p><pre style="white-space:pre-wrap;font:11px/1.4 ui-monospace,Menlo,monospace;margin:0;max-height:120px;overflow:hidden">'+esc(full.slice(-400))+'</pre>';var R=el('.rright .rbody');if(R&&RM.tab==='ai'){var b=R.querySelectorAll('.msg.ai .bub');var lb=b[b.length-1];if(lb)lb.innerHTML=msg.html;R.scrollTop=R.scrollHeight;}})
 .then(function(full){var j;try{j=JSON.parse(full.replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim());}catch(e){var m=full.match(/\{[\s\S]*\}/);try{j=m?JSON.parse(m[0]):null;}catch(e2){j=null;}}
  if(!j||!Array.isArray(j.options)||!j.options.length)throw new Error('The answer was not in the expected format. Try again or shorten the request.');
  var group='g-'+uuid().replace(/-/g,'').slice(0,8),made=0,chain=Promise.resolve();
  j.options.slice(0,4).forEach(function(op,i){var v=buildVersion(d,op);if(!Object.keys(v.files).length&&!v.order)return;var lab=j.options.length>1?(op.label||'ABCD'[i]):null;
   var row={id:uuid(),doc_id:d.id,author:ME,via:'ai',prompt:(op.summary||label)+' · '+AIDEF[c.provider].label,files:v.files,slide_order:v.order,option_group:group,option_label:lab,status:'open'};
   chain=chain.then(function(){return sb.from('proposals').insert(row).then(function(r){DB.err(r,'Saving version');made++;if(!d.proposals.some(function(x){return x.id===row.id}))d.proposals.push(mapProposal(Object.assign({updated_at:new Date().toISOString()},row)));});});});
  return chain.then(function(){msg.html=esc(j.reply||'Done.')+(made?'<div class="waiting" style="margin-top:8px">'+made+' new version'+(made>1?'s':'')+' to review · '+(isOwner(d)?'open Proposals to preview and approve':'waiting for '+esc(U(d.owner).short)+'’s approval')+'</div>':'<div class="waiting" style="margin-top:8px">No usable version came back.</div>');msg.t=now();if(RM.ide){var l0=RM.out[RM.out.length-1];if(l0)l0.stream=false;ideOut('✓ '+made+' version(s) created','ok');}
   delete d.presence.claude;refresh({all:true});if(made)toast('✦ '+made+' new version'+(made>1?'s':'')+' ready to review','claude');});
 }).catch(function(err){msg.html='<b>Could not finish.</b> '+esc(err.message||String(err));msg.t=now();if(RM.ide)ideOut('✗ '+(err.message||err),'warn');delete d.presence.claude;refresh({all:true});});
}
function aiModesHTML(d){var c=aiConn();RM.aimode=RM.aimode||'text';return '<div class="aimodes">'+AIMODES.map(function(m){return '<button data-act="aiMode" data-v="'+m[0]+'" class="'+(RM.aimode===m[0]?'on':'')+'">'+m[1]+'</button>'}).join('')+'</div>'+(RM.aimode!=='text'&&!c?'<p class="small" style="margin:6px 0 0">'+(CONN_LAST?'Your Claude is connected: ask for this in the Claude chat, or add an API key to run it here.':'Needs your AI: connect Claude or ChatGPT.')+'</p>':'');}

/* ---------- v5 clicks ---------- */
document.addEventListener('click',function(e){
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act'),v=a.getAttribute('data-v'),d=cur();
 switch(act){
  case 'vPrev':e.stopPropagation();openVersionPreview(v);break;
  case 'vpClose':var m=document.getElementById('vpModal');if(m)m.remove();break;
  case 'vpGo':VP.i+=(+v);VP.before=false;drawVP();break;
  case 'vpPick':VP.i=+v;VP.before=false;drawVP();break;
  case 'vpBefore':VP.before=!VP.before;drawVP();a=document.querySelector('[data-act="vpBefore"]');if(a)a.textContent=VP.before?'After':'Before';break;
  case 'vpApprove':var m2=document.getElementById('vpModal');if(m2)m2.remove();approve(VP.pid);break;
  case 'vpReject':var p=d.proposals.filter(function(x){return x.id===VP.pid})[0];var m3=document.getElementById('vpModal');if(m3)m3.remove();if(p)DB.reject(p.id).then(function(){p.status='rejected';refresh({all:true});toast('Version rejected',ME,true);}).catch(function(){});break;
  case 'aiMode':e.stopPropagation();RM.aimode=v;drawRight();break;
  case 'aiFree':
   if(RM&&RM.aimode&&RM.aimode!=='text'){e.stopPropagation();e.preventDefault();var q=(RM.ask||'').trim();RM.ask='';aiDesign(RM.aimode,q);break;}
   if(!aiConn()){var q2=(RM.ask||'').trim();if(!q2)break;e.stopPropagation();e.preventDefault();RM.ask='';d.chat.push({who:ME,html:esc(q2),t:now()});d.chat.push({who:'claude',html:CONN_LAST?'Your Claude is connected through the connector, so ask this in the <b>Claude chat</b>: it reads this deck and proposes new versions here. To get answers inside the Studio, add an API key in <b>Connect AI</b>.':'No AI is connected yet, so only the preset demo buttons work here. Connect your Claude or ChatGPT to get real answers and new slide versions.',t:now()});drawRight();}
   break;
 }
},true);
document.addEventListener('keydown',function(e){if(!document.getElementById('vpModal'))return;if(e.key==='ArrowRight'){VP.i++;VP.before=false;drawVP();}if(e.key==='ArrowLeft'){VP.i--;VP.before=false;drawVP();}if(e.key==='Escape'){document.getElementById('vpModal').remove();}});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){e.preventDefault();var m=document.querySelector('.modal-bg');if(m)m.remove();go(g.getAttribute('data-go'));return;}
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act'),v=a.getAttribute('data-v'),d=cur();
 switch(act){
  case 'open':go('#/room/'+v);break;
  case 'useTpl':useTpl(v);break;
  case 'tf':TF=v;render();break;
  case 'close':document.querySelector('.modal-bg').remove();break;
  case 'create':var tpl=TEMPLATES.filter(function(x){return x.id===v})[0];var nm=(document.getElementById('mName').value||'Untitled').trim();var ems=(document.getElementById('mInv').value||'').split(/[,;\s]+/).map(function(x){return x.trim().toLowerCase()}).filter(function(x){return /@/.test(x)});var role=document.getElementById('mRole').value;a.disabled=true;a.textContent='Creating…';
   DB.createDoc(tpl,nm,document.getElementById('mAI').value,ems,role).then(function(id){var mb=document.querySelector('.modal-bg');if(mb)mb.remove();toast(esc(nm)+' is ready',ME,true);go('#/room/'+id);if(ems.length)setTimeout(function(){var dd=deck(id);if(dd)openShareModal(dd);},900);}).catch(function(){a.disabled=false;a.textContent='Create and open the room';});break;
  case 'auMode':AU.mode=v;render();break;
  case 'auGo':doAuth();break;
  case 'signout':sb.auth.signOut().then(function(){setSession(null);unsubscribe();go('#/');});break;
  case 'shAdd':var se=(document.getElementById('shEmail').value||'').trim().toLowerCase(),sr=document.getElementById('shRole').value;if(!/@/.test(se)){alert('Type an e-mail');break;}DB.invite(d,se,sr).then(function(){document.querySelector('.modal-bg').redraw(se);refresh({all:true});}).catch(function(){});break;
  case 'shLink':var box=document.querySelector('.shl[data-e="'+v+'"]');if(box)box.innerHTML=box.innerHTML?'':shareLinksHTML(d,v);break;
  case 'shDel':if(confirm('Remove access for '+v+'?'))DB.uninvite(d,v).then(function(){document.querySelector('.modal-bg').redraw();refresh({all:true});}).catch(function(){});break;
  case 'copy':(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Link copied',null,true);},function(){prompt('Copy the link',v);});break;
  case 'pick':RM.path=v;RM.follow=null;pres({key:null});drawLeft();drawCenter();drawRight();break;
  case 'view':RM.view=v;drawCenter();drawLeft();break;
  case 'tab':if(RM.ide){if(v!=='ai'){RM.side=v;document.getElementById('room').classList.add('side-open');if(isMobile()){RM.pane='files';document.getElementById('room').dataset.pane='files';ideMtabs();}ideAct();ideSide();}else if(isMobile()){RM.pane='ai';document.getElementById('room').dataset.pane='ai';ideMtabs();drawRight();}break;}RM.tab=v;drawRight();if(isMobile())sheet(true);break;
  case 'follow':if(v===ME)break;RM.follow=v;var fp=d.presence[v];if(fp&&fp.path)RM.path=fp.path;drawLeft();drawCenter();drawRight();toast('Following '+U(v).short,v,true);break;
  case 'unfollow':RM.follow=null;drawTop();break;
  case 'present':var on=!(d.presence[ME]&&d.presence[ME].presenting);pres({presenting:on});toast(on?'You are presenting · others see a Follow banner':'You stopped presenting',ME,true);break;
  case 'share':openShareModal(d);break;
  case 'ai':var PRs=d.kind==='doc'?AIPD:AIP;runAI(PRs[+v][1],PRs[+v][0]+' ('+(d.kind==='doc'?'section':'slide')+' '+(d.order.indexOf(RM.path)+1)+')');break;
  case 'aiFree':var q=(RM.ask||'').trim();if(!q)break;RM.ask='';if(!canAI(d))break;if(aiConn()){realAI(d,RM.path,q,ME,aiConn());break;}var k=/span|espa/i.test(q)?'es':/short|tight|conc|curt/i.test(q)?'tighten':/academ|formal/i.test(q)?'academic':/cit|refer/i.test(q)?'cite':/question|provoc/i.test(q)?'provoke':(d.kind==='doc'?'tighten':'note');runAI(k,q);break;
  case 'approve':approve(v);break;
  case 'aiConnect':openConnect();break;
  case 'cp':var bgm=document.getElementById('cnModal');if(bgm){bgm.dataset.provider=v;CN.provider=v;drawConnect();}break;
  case 'cTest':var ct=readConn();var cm=document.getElementById('cMsg');if(!ct.key){cm.textContent='Paste an API key first.';break;}cm.textContent='Testing…';callAI(ct,'Reply with the single word OK.','Test',function(){}).then(function(t){cm.innerHTML='<span style="color:#1F7A4A">✓ Connected: '+AIDEF[ct.provider].label+' answered “'+esc(t.trim().slice(0,20))+'”.</span>';}).catch(function(err){cm.innerHTML='<span style="color:#9A3B1B">✗ '+esc(err.message||String(err))+'</span>';});break;
  case 'cSave':var cs=readConn();if(!cs.key){alert('Paste an API key.');break;}if(!document.getElementById('cOk').checked){alert('Confirm that the key belongs to your account with '+MYEMAIL+'.');break;}a.disabled=true;saveConn(cs).then(function(){track('ai_connect',ME,null,{provider:cs.provider,model:cs.model,email:cs.email,stored:'account'});var mb2=document.getElementById('cnModal');if(mb2)mb2.remove();toast(AIDEF[cs.provider].label+' saved to your account · '+esc(MYEMAIL),ME,true);if(RM){drawRight();if(RM.ide){ideTitle();ideStatus();}}}).catch(function(){a.disabled=false;});break;
  case 'cOff':var pv0=document.getElementById('cnModal').dataset.provider;if(!KEYS[pv0]){toast('No '+AIDEF[pv0].label+' key saved',ME,true);break;}DB.delKey(pv0).then(function(){var mb3=document.getElementById('cnModal');if(mb3)mb3.remove();toast(AIDEF[pv0].label+' key removed',ME,true);if(RM){drawRight();if(RM.ide){ideTitle();ideStatus();}}}).catch(function(){});break;
  case 'applyAI':var cc=d.comments.filter(function(x){return x.id===v})[0];if(cc){var kk=/span|espa/i.test(cc.text)?'es':/concis|short|long|tight|curt/i.test(cc.text)?'tighten':/academ|formal/i.test(cc.text)?'academic':/cit|refer/i.test(cc.text)?'cite':/question|provoc/i.test(cc.text)?'provoke':(d.kind==='doc'?'tighten':'note');RM.path=cc.path;drawLeft();drawCenter();cc.applied=true;DB.updComment(cc.id,{applied:true}).catch(function(){});if(aiConn()){realAI(d,cc.path,'Apply this comment from '+U(cc.author).name+': '+cc.text,ME,aiConn());}else runAI(kk,'Apply '+U(cc.author).short+'’s comment: “'+cc.text.slice(0,70)+'”');}break;
  case 'export':exportHTML(d);break;
  case 'reject':var p=d.proposals.filter(function(x){return x.id===v})[0];if(p){flushSave(d,p).then(function(){return DB.reject(v);}).then(function(){p.status=isOwner(d)?'rejected':'withdrawn';refresh({all:true});toast((p.author===ME&&!isOwner(d)?'Proposal withdrawn':'Proposal rejected'),ME);}).catch(function(){});}break;
  case 'comment':var t=(RM.draft||'').trim();if(!t)break;var row={id:uuid(),doc_id:d.id,path:RM.path,field:RM.editing||null,author:ME,body:t,created_at:new Date().toISOString(),resolved:false,applied:false};DB.comment({id:row.id,doc_id:d.id,path:row.path,field:row.field,author:ME,body:t}).then(function(){if(!d.rawComments.some(function(x){return x.id===row.id}))d.rawComments.push(row);d.comments=threadComments(d.rawComments);track('comment',ME,d.id,{slide:d.order.indexOf(RM.path)+1});RM.draft='';drawRight();}).catch(function(){});break;
  case 'reply':var c=d.comments.filter(function(x){return x.id===v})[0];var tx=(RM['r_'+v]||'').trim();if(c&&tx){var rr={id:uuid(),doc_id:d.id,parent_id:c.id,path:c.path,author:ME,body:tx};DB.comment(rr).then(function(){rr.created_at=new Date().toISOString();if(!d.rawComments.some(function(x){return x.id===rr.id}))d.rawComments.push(rr);d.comments=threadComments(d.rawComments);RM['r_'+v]='';drawRight();}).catch(function(){});}break;
  case 'resolve':var c2=d.comments.filter(function(x){return x.id===v})[0];if(c2){DB.updComment(c2.id,{resolved:true}).then(function(){d.rawComments.forEach(function(x){if(x.id===c2.id)x.resolved=true;});d.comments=threadComments(d.rawComments);drawRight();}).catch(function(){});}break;
  case 'restore':var ver=d.versions.filter(function(x){return x.n===+v})[0];if(ver){if(!canEdit(d))break;var pr={id:uuid(),author:ME,via:'human',prompt:'Restore v'+ver.n,files:{},status:'open',t:now(),saved:false};Object.keys(ver.snap).forEach(function(k){if(ver.snap[k]!==d.files[k])pr.files[k]=ver.snap[k];});d.proposals.push(pr);DB.saveProposal(d,pr).catch(function(){});RM.tab='props';share({all:true});toast('v'+ver.n+' restored as a proposal',ME,true);}break;
  case 'mcpPick':MC.tool=v;MC.args=JSON.stringify(JSON.parse(a.getAttribute('data-ex')),null,2);MC.out='';render();break;
  case 'mcpRun':var args;try{args=JSON.parse(MC.args||'{}')}catch(err){MC.out='// Invalid JSON: '+err.message;document.getElementById('mcpOut').textContent=MC.out;break;}
   var req={jsonrpc:'2.0',id:Math.floor(Math.random()*1000),method:'tools/call',params:{name:MC.tool,arguments:args}};document.getElementById('mcpOut').textContent='→ '+JSON.stringify(req)+'\n\n… running';mcpHandle(req).then(function(res){var shown=res.result&&res.result.structuredContent?{jsonrpc:'2.0',id:res.id,result:{structuredContent:res.result.structuredContent}}:res;MC.out='→ '+JSON.stringify(req)+'\n\n← '+JSON.stringify(shown,null,2);var o=document.getElementById('mcpOut');if(o)o.textContent=MC.out;});break;
  case 'mcpList':var rq={jsonrpc:'2.0',id:1,method:'tools/list'};mcpHandle(rq).then(function(res){MC.out='→ '+JSON.stringify(rq)+'\n\n← '+JSON.stringify(res,null,2);document.getElementById('mcpOut').textContent=MC.out;});break;
  case 'vp':VW.i--;vDraw();break;case 'vn':VW.i++;vDraw();break;
  case 'vreload':var dd=deck(VW.id);VW.n=dd.versions.length;VW.snap=clone(dd.files);vDraw();viewCheck();break;
  case 'follow0':break;
 }
});
